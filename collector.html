:root {

  --au-action: #C8551B; --au-border: #CFD2D5;

}

  --au-action: #E8763B; --au-border: #2A2F34;

}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--au-bg); color: var(--au-text); font-family: var(--au-sans); }

<body>
<div id="app"></div>
<script>
"use strict";
// ── src/js/records/address.js ──
// Content-addressing & stream identity — SPEC-hopper-records §1, §3. Pure.
//
// Self-contained base64url for now; will delegate to the vendored @gcu/capsule
// `bytesToB64Url` once vendored (same output). `crypto` is the Web Crypto global,
// present in browsers and Node ≥ 20.

const B64URL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

// Unpadded, URL-safe base64 of a byte sequence.
function bytesToB64Url(input) {
  const b = new Uint8Array(input);
  let out = '';
  for (let i = 0; i < b.length; i += 3) {
    const rem = b.length - i;
    const n = (b[i] << 16) | ((rem > 1 ? b[i + 1] : 0) << 8) | (rem > 2 ? b[i + 2] : 0);
    out += B64URL[(n >> 18) & 63] + B64URL[(n >> 12) & 63];
    if (rem > 1) out += B64URL[(n >> 6) & 63];
    if (rem > 2) out += B64URL[n & 63];
  }
  return out;
}

// Inverse of bytesToB64Url. Tolerates the unpadded URL-safe form.
function b64UrlToBytes(s) {
  const std = s.replace(/-/g, '+').replace(/_/g, '/');
  const pad = std.length % 4 ? '='.repeat(4 - (std.length % 4)) : '';
  const bin = atob(std + pad);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const utf8 = (s) => new TextEncoder().encode(s);

async function sha256(bytes) {
  return new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
}

// `sha256-<b64url>` — the content address of forms and attachment blobs (§3).
async function contentAddress(bytes) {
  return 'sha256-' + bytesToB64Url(await sha256(bytes));
}

// The self-verifying stream handle (§1): a 22-char (~128-bit) base64url prefix of
// SHA-256 over the identifying triple. The spec's `‖` join is realized here as a
// length-prefixed encoding, so no field's content can be confused for another's.
async function streamId(pubkey, deviceId, epoch) {
  const joined = utf8([pubkey, deviceId, epoch].map((s) => `${String(s).length}:${s}`).join(''));
  return bytesToB64Url(await sha256(joined)).slice(0, 22);
}

// ── src/js/records/jcs.js ──
// RFC 8785 — JSON Canonicalization Scheme (JCS). SPEC-hopper-records §3.
//
// The one agreed byte form for *signing*: independent implementations must
// serialize the same data to the same bytes or signatures won't verify. JCS
// pins this with an IETF standard + official test vectors.
//
// We lean on the host `JSON.stringify`, which is already JCS-compliant for the
// hard parts: numbers use ECMAScript's shortest-round-trip algorithm (exactly
// what JCS mandates) and strings use minimal RFC 8259 escaping (raw non-ASCII,
// unescaped `/`). All we add is recursive key sorting by UTF-16 code unit —
// which is JS's default string sort. Non-finite numbers are rejected (JCS, like
// JSON, has no NaN/Infinity).
//
// NOTE (SPEC-hopper-records §3): this is the *signing* form only. Records are
// *stored* as plain pretty JSON (readable git diffs); the signature is computed
// over canonicalize(data), independent of the stored file's whitespace.

function canonicalize(value) {
  return ser(value);
}

function ser(v) {
  if (v === null) return 'null';
  const t = typeof v;
  if (t === 'boolean') return v ? 'true' : 'false';
  if (t === 'number') {
    if (!Number.isFinite(v)) throw new Error('JCS: non-finite number not serializable');
    return JSON.stringify(v);             // ECMAScript Number serialization == JCS
  }
  if (t === 'string') return JSON.stringify(v);   // minimal RFC 8259 escaping == JCS
  if (Array.isArray(v)) return '[' + v.map(ser).join(',') + ']';
  if (t === 'object') {
    const parts = [];
    for (const k of Object.keys(v).sort()) {       // UTF-16 code-unit order
      const val = v[k];
      if (val === undefined) continue;             // JSON drops undefined members
      parts.push(JSON.stringify(k) + ':' + ser(val));
    }
    return '{' + parts.join(',') + '}';
  }
  throw new Error(`JCS: unsupported value type (${t})`);
}

// ── src/js/records/crypto.js ──
// Ed25519 sign / verify / keygen — SPEC-hopper-records §3. The provenance layer.
//
// Prefers native Web Crypto Ed25519 (auditable's notebook-signing approach;
// fast, zero-dependency). When a browser lacks it, a **vendored noble-ed25519**
// backend takes over — bundled, never lazy-loaded (a fallback can't depend on a
// network fetch that may not be there; same rule as ggwave). Wire it once at
// startup with `setEd25519Backend(adapter)` (see vendor/PROVENANCE.md for the
// adapter shape). noble's SHA-512 comes from Web Crypto (universally supported).
//
// Keys are raw 32-byte values, base64url — matching auditable's keygen/sign, so
// keys interoperate across the stack. (Never hand-roll the curve math; this file
// only does key *encoding* around vetted implementations.)



// PKCS#8 DER prefix for an Ed25519 private key; the 32-byte seed follows.
const PKCS8_ED25519_PREFIX = Uint8Array.from(
  [0x30, 0x2e, 0x02, 0x01, 0x00, 0x30, 0x05, 0x06, 0x03, 0x2b, 0x65, 0x70, 0x04, 0x22, 0x04, 0x20]);

let _backend = null;
let _native = null;

// Install the vendored noble backend. Adapter shape:
//   { generateStreamKey(): {publicKey,privateKey b64url},
//     sign(bytes, seedBytes): sigBytes,  verify(bytes, sigBytes, pubBytes): bool }
function setEd25519Backend(adapter) { _backend = adapter; }

async function nativeOK() {
  if (_native !== null) return _native;
  try { await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']); _native = true; }
  catch { _native = false; }
  return _native;
}

function pkcs8FromSeed(seed) {
  const der = new Uint8Array(PKCS8_ED25519_PREFIX.length + 32);
  der.set(PKCS8_ED25519_PREFIX, 0);
  der.set(seed, PKCS8_ED25519_PREFIX.length);
  return der;
}

function unavailable() {
  throw new Error('Ed25519 unavailable: no Web Crypto support and no vendored backend (vendor/PROVENANCE.md)');
}

async function generateStreamKey() {
  if (await nativeOK()) {
    const kp = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
    const pub = new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey));
    const pkcs8 = new Uint8Array(await crypto.subtle.exportKey('pkcs8', kp.privateKey));
    return { publicKey: bytesToB64Url(pub), privateKey: bytesToB64Url(pkcs8.slice(-32)) };
  }
  if (_backend) return _backend.generateStreamKey();
  unavailable();
}

async function sign(bytes, privateKeyB64) {
  const seed = b64UrlToBytes(privateKeyB64);
  if (await nativeOK()) {
    const key = await crypto.subtle.importKey('pkcs8', pkcs8FromSeed(seed), { name: 'Ed25519' }, false, ['sign']);
    return bytesToB64Url(new Uint8Array(await crypto.subtle.sign('Ed25519', key, bytes)));
  }
  if (_backend) return bytesToB64Url(await _backend.sign(bytes, seed));
  unavailable();
}

async function verify(bytes, sigB64, publicKeyB64) {
  const sig = b64UrlToBytes(sigB64), pub = b64UrlToBytes(publicKeyB64);
  if (await nativeOK()) {
    const key = await crypto.subtle.importKey('raw', pub, { name: 'Ed25519' }, false, ['verify']);
    return crypto.subtle.verify('Ed25519', key, sig, bytes);
  }
  if (_backend) return _backend.verify(bytes, sig, pub);
  unavailable();
}

// ── src/js/records/envelope.js ──
// The record envelope — SPEC-hopper-records §2, §5, §9. The save boundary:
// a finished fill becomes an immutable, signed record. Pure data + crypto;
// no storage, no counter source (storage owns the monotonic counter), no UI.




const enc = new TextEncoder();

// The bytes that get signed: the JCS canonicalization of the envelope without
// its own signature (§3). Stored files may be pretty-printed; this re-derives
// the signing bytes from the data, so whitespace never affects verification.
function signingBytes(env) {
  const { sig, ...rest } = env;
  return enc.encode(canonicalize(rest));
}

// Build + sign a record. `ctx` carries the stream context storage provides.
//   { stream, counter, form, values?, attachments?, at?, kind?, supersedes? }
async function makeRecord(ctx, privateKeyB64) {
  const env = {
    v: 1,
    id: `${ctx.stream}/${ctx.counter}`,
    kind: ctx.kind || 'record',
    form: ctx.form,
    at: ctx.at ?? null,                 // best-effort device time; never an ordering key (§7)
    values: ctx.values || {},
    attachments: ctx.attachments || {},
    supersedes: ctx.supersedes ?? null,
  };
  env.sig = await sign(signingBytes(env), privateKeyB64);
  return env;
}

async function verifyRecord(env, publicKeyB64) {
  if (!env || typeof env.sig !== 'string') return false;
  try { return await verify(signingBytes(env), env.sig, publicKeyB64); }
  catch { return false; }
}

// A correction supersedes a record with new values; a tombstone retracts it.
// Both are ordinary signed records in the author's stream (§5).
function correct(originalId, newValues, ctx, privateKeyB64) {
  return makeRecord({ ...ctx, kind: 'correction', supersedes: originalId, values: newValues }, privateKeyB64);
}
function tombstone(originalId, ctx, privateKeyB64) {
  return makeRecord({ ...ctx, kind: 'tombstone', supersedes: originalId, values: {} }, privateKeyB64);
}

// Resolve supersede-chains to effective records (§5): the head of each chain
// (the record nothing supersedes), with tombstoned chains dropped.
//
// v1 assumes single-writer-per-stream, so chains are linear (no forks); the
// cross-stream `(counter, stream-id)` tiebreak for forks is a noted refinement.
function resolve(records) {
  const superseded = new Set();
  for (const r of records) if (r.supersedes) superseded.add(r.supersedes);
  const out = [];
  for (const r of records) {
    if (superseded.has(r.id)) continue;     // not a chain head
    if (r.kind === 'tombstone') continue;   // head is a retraction → drop
    out.push(r);
  }
  return out;
}

// ── src/js/rules/eval.js ──
// The rule-expression language — SPEC-hopper-rules. A small, *total*, pure
// expression calculus over the fields of one record. Totality is the security
// boundary: no loops, recursion, I/O, or unbounded ops; every expression
// terminates and never throws at eval time (bad math → blank, not an exception).
//
// Pipeline: tokenize → parse to an AST → ev(). `deps()` extracts the free field
// references so the renderer can wire each rule into the reactive DAG
// (@gcu/sideact). Blank is represented as `null`.
//
// Syntax (XLSForm-anchored): symbolic comparisons & arithmetic
// (`< > <= >= = != + - * /`), word booleans (`and`/`or`/`not`), and keyword sugar
// (`between … and …`, `contains`, `is blank`/`is filled`, `matches`). Parsing
// uses the standard precedence ladder (or < and < not < comparison < additive <
// multiplicative < unary < primary), which realizes the spec grammar and makes
// `(` unambiguous (a parenthesised group is a full expression — boolean or
// arithmetic alike).

const RESERVED = new Set(['and', 'or', 'not', 'between', 'contains', 'matches', 'is', 'blank', 'filled']);

function fail(msg) { throw new Error('rule parse error: ' + msg); }

// ── lexer ──────────────────────────────────────────────────────────────────
// Bare field refs start with a letter/underscore; `${…}` references any field
// id (incl. digit-leading). Subtraction needs surrounding space (`a - 5`), since
// `-` is a valid identifier character and `a-5` lexes as one id (spec §3 ident).
function tokenize(src) {
  const re = /(\s+)|(\$\{[a-z0-9_-]+\})|("[^"]*")|(<=|>=|!=|<|>|=)|([-+*/()])|(\d+(?:\.\d+)?)|([a-z_][a-z0-9_-]*)/y;
  const toks = [];
  let last = 0;
  while (last < src.length) {
    re.lastIndex = last;
    const m = re.exec(src);
    if (!m) fail(`unexpected character at ${last}: "${src.slice(last, last + 8)}"`);
    last = re.lastIndex;
    if (m[1] !== undefined) continue;                                   // whitespace
    else if (m[2] !== undefined) toks.push({ k: 'field', v: m[2].slice(2, -1) });
    else if (m[3] !== undefined) toks.push({ k: 'str', v: m[3].slice(1, -1) });
    else if (m[4] !== undefined) toks.push({ k: 'op', v: m[4] });
    else if (m[5] !== undefined) toks.push({ k: 'op', v: m[5] });
    else if (m[6] !== undefined) toks.push({ k: 'num', v: parseFloat(m[6]) });
    else toks.push({ k: 'word', v: m[7] });
  }
  return toks;
}

// ── parser ───────────────────────────────────────────────────────────────────
function parse(src) {
  const toks = tokenize(src);
  let i = 0;
  const op = (v) => toks[i] && toks[i].k === 'op' && toks[i].v === v;
  const word = (v) => toks[i] && toks[i].k === 'word' && toks[i].v === v;
  const eatOp = (v) => { if (!op(v)) fail(`expected '${v}'`); i++; };

  function primary() {
    const t = toks[i];
    if (!t) fail('unexpected end of expression');
    if (t.k === 'op' && t.v === '(') { i++; const e = expr(); eatOp(')'); return e; }
    if (t.k === 'num') { i++; return { t: 'num', v: t.v }; }
    if (t.k === 'str') { i++; return { t: 'str', v: t.v }; }
    if (t.k === 'field') { i++; return { t: 'field', name: t.v }; }
    if (t.k === 'word') {
      i++;
      if (t.v === 'true') return { t: 'bool', v: true };
      if (t.v === 'false') return { t: 'bool', v: false };
      if (RESERVED.has(t.v)) fail(`unexpected keyword '${t.v}'`);
      return { t: 'field', name: t.v };
    }
    fail(`unexpected '${t.v}'`);
  }
  function unary() {
    if (op('-') || op('+')) { const neg = op('-'); i++; const e = unary(); return neg ? { t: 'neg', e } : e; }
    return primary();
  }
  function mul() {
    let l = unary();
    while (op('*') || op('/')) { const o = toks[i].v; i++; l = { t: o, l, r: unary() }; }
    return l;
  }
  function add() {
    let l = mul();
    while (op('+') || op('-')) { const o = toks[i].v; i++; l = { t: o, l, r: mul() }; }
    return l;
  }
  function comparison() {
    const l = add();
    if (op('<') || op('>') || op('<=') || op('>=') || op('=') || op('!=')) {
      const o = toks[i].v; i++; return { t: 'cmp', op: o, l, r: add() };
    }
    if (word('between')) { i++; const lo = add(); if (!word('and')) fail("expected 'and' in between"); i++; return { t: 'between', e: l, lo, hi: add() }; }
    if (word('contains')) { i++; return { t: 'contains', l, r: add() }; }
    if (word('matches')) { i++; if (!toks[i] || toks[i].k !== 'str') fail("'matches' needs a string literal"); const re = toks[i].v; i++; return { t: 'matches', e: l, re }; }
    if (word('is')) { i++; if (word('blank')) { i++; return { t: 'isblank', e: l }; } if (word('filled')) { i++; return { t: 'isfilled', e: l }; } fail("'is' must be followed by 'blank' or 'filled'"); }
    return l;
  }
  function notE() { if (word('not')) { i++; return { t: 'not', e: comparison() }; } return comparison(); }
  function andE() { let l = notE(); while (word('and')) { i++; l = { t: 'and', l, r: notE() }; } return l; }
  function orE() { let l = andE(); while (word('or')) { i++; l = { t: 'or', l, r: andE() }; } return l; }
  function expr() { return orE(); }

  const ast = expr();
  if (i < toks.length) fail(`trailing input near '${toks[i].v}'`);
  return ast;
}

// ── value helpers ────────────────────────────────────────────────────────────
function isBlank(v) { return v === null || v === undefined || v === '' || (Array.isArray(v) && v.length === 0); }
function num(v) {
  if (isBlank(v) || typeof v === 'boolean' || Array.isArray(v)) return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function ord(a, b, o) { return o === '<' ? a < b : o === '>' ? a > b : o === '<=' ? a <= b : a >= b; }
function eq(a, b) {
  if (isBlank(a) && isBlank(b)) return true;       // §4.1: blank = blank → true
  if (isBlank(a) || isBlank(b)) return false;      //       x = blank → false
  const na = num(a), nb = num(b);
  return (na !== null && nb !== null) ? na === nb : String(a) === String(b);
}
function compare(a, b, o) {
  if (o === '=') return eq(a, b);
  if (o === '!=') return !eq(a, b);
  if (isBlank(a) || isBlank(b)) return null;       // §4.1: ordering on blank → blank
  const na = num(a), nb = num(b);
  return (na !== null && nb !== null) ? ord(na, nb, o) : ord(String(a), String(b), o);
}

// ── evaluator ────────────────────────────────────────────────────────────────
function ev(n, V) {
  switch (n.t) {
    case 'num': case 'str': case 'bool': return n.v;
    case 'field': { const x = V[n.name]; return x === undefined ? null : x; }
    case 'neg': { const a = num(ev(n.e, V)); return a === null ? null : -a; }
    case '+': case '-': case '*': case '/': {
      const a = num(ev(n.l, V)), b = num(ev(n.r, V));
      if (a === null || b === null) return null;
      if (n.t === '+') return a + b;
      if (n.t === '-') return a - b;
      if (n.t === '*') return a * b;
      return b === 0 ? null : a / b;               // §3.3: ÷0 → blank, never throws
    }
    case 'cmp': return compare(ev(n.l, V), ev(n.r, V), n.op);
    case 'between': {
      const ge = compare(ev(n.e, V), ev(n.lo, V), '>='), le = compare(ev(n.e, V), ev(n.hi, V), '<=');
      return (ge === null || le === null) ? null : (ge && le);
    }
    case 'contains': {
      const a = ev(n.l, V); if (isBlank(a)) return false;
      const b = String(ev(n.r, V));
      return Array.isArray(a) ? a.map(String).includes(b) : String(a).includes(b);
    }
    case 'matches': {
      const a = ev(n.e, V); if (isBlank(a)) return false;
      try { return new RegExp(n.re).test(String(a)); } catch { return false; }
    }
    case 'isblank': return isBlank(ev(n.e, V));
    case 'isfilled': return !isBlank(ev(n.e, V));
    case 'not': return ev(n.e, V) !== true;
    case 'and': return ev(n.l, V) === true && ev(n.r, V) === true;
    case 'or': return ev(n.l, V) === true || ev(n.r, V) === true;
  }
  return null;
}

const asAst = (x) => (typeof x === 'string' ? parse(x) : x);

// Raw value: boolean, number, string, set, or `null` (blank). For `calculate`.
function evaluate(exprOrAst, values) {
  const r = ev(asAst(exprOrAst), values || {});
  return r === undefined ? null : r;
}

// Boolean reading (blank → false): for relevant / require / show / constrain body.
function evalBool(exprOrAst, values) { return evaluate(exprOrAst, values) === true; }

// §4.3/§4.4 — a field is constraint-valid iff it is blank OR the constraint holds.
function constraintValid(exprOrAst, values, target) {
  if (isBlank((values || {})[target])) return true;
  return evaluate(exprOrAst, values) === true;
}

// Free field references — the rule's dependencies for the reactive DAG (§5).
function deps(exprOrAst) {
  const out = new Set();
  (function walk(n) {
    if (!n || typeof n !== 'object') return;
    if (n.t === 'field') { out.add(n.name); return; }
    for (const k of ['e', 'l', 'r', 'lo', 'hi']) if (n[k]) walk(n[k]);
  })(asAst(exprOrAst));
  return [...out];
}

// ── src/js/boot.js ──
// Boot — mounts the collector shell and registers the service worker.
// Scaffold: renders a placeholder (and a live content-address, proving the
// records/ module works in-browser) until the renderer and shell land.



async function mount() {
  const app = document.getElementById('app');
  if (!app) return;
  let addr = '(computing…)';
  try { addr = await contentAddress(utf8('hopper')); } catch (e) { addr = '(crypto unavailable)'; }
  app.innerHTML = `
    <main class="scaffold">
      <h1>Hopper</h1>
      <p class="tag">collector · scaffold build</p>
      <p class="muted">The shell, renderer, storage, and sync land here.
      See <code>docs/</code> for the specs.</p>
      <p class="muted">content-address of <code>"hopper"</code>:<br><code>${addr}</code></p>
    </main>`;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
document.addEventListener('DOMContentLoaded', mount);
</script>
</body>
