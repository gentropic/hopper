<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Hopper · mill</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('hopper-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
/* Switchboard design tokens — the canonical GCU design system (DECISIONS §14,
   Phase 1). Transcribed from @gcu/switchboard (ext/switchboard SPEC; values match
   the vendored weir/vendor/switchboard tokens.css). Two layers: --sw-* swatches
   (theme-switched) → --au-* semantic API (what the rules below read; Hopper keeps
   its own --au-* names mapped onto the swatches). Light = "equipment gray" (:root);
   dark = "basalt" ([data-theme="dark"], or auto via prefers-color-scheme).
   Fonts (Barlow / Space Mono) are named with system fallbacks; embedding the woff2
   as base64 is deferred — a later Phase-1 step. Don't re-add @font-face without the
   inlined fonts (a 404 font fetch trips the smokes). */

:root {
  /* ── swatches — light / equipment gray ── */
  --sw-bg-deep: #C2C1BE; --sw-bg: #D2D1CE; --sw-bg-raised: #E4E3E1; --sw-bg-bright: #EDECEB;
  --sw-text: #232322; --sw-text-mid: #504F4C; --sw-text-soft: #7A7875;
  --sw-border: #B3B1AD; --sw-border-soft: #C6C4C1; --sw-rule: #A5A3A0;
  --sw-orange: #B54E1A; --sw-orange-soft: #E8D8CF;
  --sw-teal: #1B6B72; --sw-teal-soft: #CEE2E4;
  --sw-green: #3D7340; --sw-green-soft: #D2E4D4;
  --sw-amber: #8E6518; --sw-amber-soft: #E4DCCC;
  --sw-red: #A8312A; --sw-red-soft: #E8D6D4;
  --sw-indigo: #4E5580; --sw-indigo-soft: #D8D9E2;

  /* ── semantic API — Hopper's --au-* names sit on the swatches ── */
  --au-bg: var(--sw-bg); --au-surface: var(--sw-bg-raised);
  --au-text: var(--sw-text); --au-muted: var(--sw-text-mid);
  --au-action: var(--sw-orange); --au-border: var(--sw-border);
  --au-success: var(--sw-green); --au-success-soft: var(--sw-green-soft);
  --au-warn: var(--sw-amber); --au-warn-soft: var(--sw-amber-soft);
  --au-error: var(--sw-red); --au-error-soft: var(--sw-red-soft);
  --au-info: var(--sw-teal); --au-info-soft: var(--sw-teal-soft);
  --au-selected: var(--sw-indigo); --au-selected-soft: var(--sw-indigo-soft);
  --au-sans: 'Barlow', system-ui, -apple-system, sans-serif;
  --au-mono: 'Space Mono', ui-monospace, 'SFMono-Regular', monospace;
}
[data-theme="dark"] {
  /* basalt — overrides swatches only; --au-* auto-resolve */
  --sw-bg-deep: #0E1012; --sw-bg: #15171A; --sw-bg-raised: #1D2024; --sw-bg-bright: #25282D;
  --sw-text: #DDDCDA; --sw-text-mid: #9E9C98; --sw-text-soft: #6E6C68;
  --sw-border: #2F3338; --sw-border-soft: #24272B; --sw-rule: #3A3E44;
  --sw-orange: #D4672E; --sw-orange-soft: #2E1F18;
  --sw-teal: #3A9BA3; --sw-teal-soft: #16272A;
  --sw-green: #5A9B5E; --sw-green-soft: #18261A;
  --sw-amber: #C49540; --sw-amber-soft: #2A2316;
  --sw-red: #D05048; --sw-red-soft: #2C1A18;
  --sw-indigo: #7E86B8; --sw-indigo-soft: #1E2030;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {   /* "auto": follow the OS when no explicit choice */
    --sw-bg-deep: #0E1012; --sw-bg: #15171A; --sw-bg-raised: #1D2024; --sw-bg-bright: #25282D;
    --sw-text: #DDDCDA; --sw-text-mid: #9E9C98; --sw-text-soft: #6E6C68;
    --sw-border: #2F3338; --sw-border-soft: #24272B; --sw-rule: #3A3E44;
    --sw-orange: #D4672E; --sw-orange-soft: #2E1F18;
    --sw-teal: #3A9BA3; --sw-teal-soft: #16272A;
    --sw-green: #5A9B5E; --sw-green-soft: #18261A;
    --sw-amber: #C49540; --sw-amber-soft: #2A2316;
    --sw-red: #D05048; --sw-red-soft: #2C1A18;
    --sw-indigo: #7E86B8; --sw-indigo-soft: #1E2030;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--au-bg); color: var(--au-text); font-family: var(--au-sans); }
#app { min-height: 100%; }

.scaffold { text-align: center; padding: 2rem; max-width: 32rem; margin: 0 auto; }
.scaffold h1 { font-family: var(--au-mono); letter-spacing: .02em; margin: 0 0 .25rem; }
.scaffold .tag { color: var(--au-action); font-family: var(--au-mono); font-size: .85rem; }
.scaffold .muted { color: var(--au-muted); font-size: .9rem; }
.scaffold code { font-family: var(--au-mono); font-size: .8rem; word-break: break-all; }

/* ── form renderer ─────────────────────────────────────────────────────── */
.hf-badge { font-family: var(--au-mono); font-size: .72rem; padding: .12rem .5rem; border-radius: 999px; color: #fff; }  /* persistence pill — shell Settings */
.hf-badge.ok { background: var(--au-success); }     /* go */
.hf-badge.warn { background: var(--au-warn); }   /* caution */
.hf-form { display: flex; flex-direction: column; gap: .9rem; }

.hf-field { display: flex; flex-direction: column; gap: .25rem; }
.hf-field[hidden], .hf-group[hidden] { display: none; }
.hf-label { font-size: .85rem; color: var(--au-muted); }
.hf-field input, .hf-field select {
  font: inherit; padding: .5rem .6rem; border: 1px solid var(--au-border);
  border-radius: 6px; background: var(--au-surface); color: var(--au-text);
}
.hf-field.hf-invalid input, .hf-field.hf-invalid select { border-color: var(--au-error); }
.hf-error { color: var(--au-error); font-size: .78rem; min-height: 1em; }
.hf-calc { font-family: var(--au-mono); color: var(--au-text); }
.hf-note { color: var(--au-muted); font-style: italic; margin: .25rem 0; }
.hf-stub { color: var(--au-muted); font-size: .85rem; padding: .5rem; border: 1px dashed var(--au-border); border-radius: 6px; }
.hf-geo { display: flex; align-items: center; gap: .6rem; }
.hf-capture { font: inherit; font-size: .85rem; padding: .35rem .7rem; border: 1px solid var(--au-border); border-radius: 6px; background: var(--au-surface); color: var(--au-action); cursor: pointer; }
.hf-geo-val { font-family: var(--au-mono); font-size: .78rem; color: var(--au-muted); }
.hf-geopath { display: flex; flex-direction: column; gap: .4rem; align-items: flex-start; }
.hf-geopath-list { display: flex; flex-direction: column; gap: .2rem; width: 100%; }
.hf-geopt { display: flex; align-items: center; gap: .5rem; font-family: var(--au-mono); font-size: .76rem; }
.hf-geopt-i { color: var(--au-muted); min-width: 1.2rem; }
.hf-geopt-val { color: var(--au-text); }
.hf-geopt-rm { margin-left: auto; border: none; background: none; color: var(--au-muted); font-size: 1rem; cursor: pointer; }
.hf-media { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
.hf-media-val { font-family: var(--au-mono); font-size: .78rem; color: var(--au-success); }   /* go */
.hf-barcode { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
.hf-scan-video { width: 100%; max-width: 360px; border-radius: 8px; border: 1px solid var(--au-border); background: #000; }
.hf-multi { display: flex; flex-wrap: wrap; gap: .5rem; }
.hf-check { display: inline-flex; align-items: center; gap: .2rem; font-size: .9rem; }

.hf-group { border: 1px solid var(--au-border); border-radius: 8px; padding: .25rem .75rem .75rem; }
.hf-group > summary { font-family: var(--au-mono); font-size: .85rem; cursor: pointer; padding: .5rem 0; color: var(--au-muted); }
.hf-group > .hf-field, .hf-group > .hf-repeat { margin-top: .6rem; }

.hf-repeat { border-left: 2px solid var(--au-action); padding-left: .75rem; }
.hf-repeat-head { font-family: var(--au-mono); font-size: .85rem; color: var(--au-muted); margin: .25rem 0; }
.hf-instance { position: relative; border: 1px solid var(--au-border); border-radius: 8px; padding: .75rem; margin-bottom: .6rem; display: flex; flex-direction: column; gap: .6rem; }
.hf-remove { position: absolute; top: .4rem; right: .4rem; border: none; background: none; color: var(--au-muted); font-size: 1.1rem; cursor: pointer; }
.hf-add { align-self: flex-start; font: inherit; padding: .35rem .8rem; border: 1px solid var(--au-border); border-radius: 6px; background: var(--au-surface); color: var(--au-action); cursor: pointer; }

.hf-flags { display: flex; gap: .4rem; flex-wrap: wrap; min-height: 1.5rem; margin-bottom: .5rem; }
.hf-flag { font-family: var(--au-mono); font-size: .72rem; background: var(--au-action); color: #fff; padding: .12rem .5rem; border-radius: 999px; }
.hf-save { margin-top: 1.25rem; font: inherit; padding: .55rem 1.1rem; border: none; border-radius: 6px; background: var(--au-action); color: #fff; cursor: pointer; }
.hf-out { font-family: var(--au-mono); font-size: .72rem; white-space: pre-wrap; word-break: break-all; background: var(--au-surface); border: 1px solid var(--au-border); border-radius: 6px; padding: .6rem; margin-top: .75rem; }
.hf-out:empty { display: none; }

/* ── collector shell ───────────────────────────────────────────────────── */
.co-app { max-width: 34rem; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.co-top { display: flex; align-items: center; gap: .6rem; padding: .75rem 1rem; border-bottom: 1px solid var(--au-border); }
.co-brand { font-family: var(--au-mono); font-weight: 600; letter-spacing: .02em; }
.co-pill { margin-left: auto; font-family: var(--au-mono); font-size: .72rem; color: var(--au-muted); border: 1px solid var(--au-border); border-radius: 999px; padding: .12rem .6rem; }
.co-warn { background: var(--au-warn-soft); color: var(--au-warn); font-size: .8rem; padding: .5rem 1rem; border-bottom: 1px solid var(--au-warn); }
.co-warn[hidden] { display: none; }
.co-screen { flex: 1; padding: 1rem 1rem 5rem; }
.co-nav { position: sticky; bottom: 0; display: flex; background: var(--au-surface); border-top: 1px solid var(--au-border); }
.co-nav button { flex: 1; font: inherit; font-size: .8rem; padding: .7rem .3rem; border: none; background: none; color: var(--au-muted); cursor: pointer; border-top: 2px solid transparent; margin-top: -1px; }
.co-nav button.on { color: var(--au-action); border-top-color: var(--au-action); }

.co-view { display: flex; flex-direction: column; gap: .6rem; }
.co-vhead { display: flex; align-items: baseline; gap: .6rem; }
.co-vhead h2 { font-family: var(--au-mono); font-size: 1.1rem; margin: 0; }
.co-empty { color: var(--au-muted); font-size: .9rem; }

.co-onboard { border: 1px solid var(--au-border); border-left: 3px solid var(--au-action); border-radius: 8px; padding: .7rem .8rem; background: var(--au-surface); display: flex; flex-direction: column; gap: .4rem; }
.co-onboard-h { font-weight: 600; font-size: .95rem; }
.co-onboard-b { font-size: .82rem; color: var(--au-muted); line-height: 1.4; }
.co-onboard-acts { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .2rem; }

.co-addrow { display: flex; align-items: center; gap: .5rem; font: inherit; font-size: .9rem; padding: .5rem .7rem; border: 1px dashed var(--au-border); border-radius: 8px; background: none; color: var(--au-text); cursor: pointer; }
.co-plus { color: var(--au-action); font-size: 1.2rem; line-height: 1; }
.co-sheet { border: 1px solid var(--au-border); border-radius: 8px; padding: .75rem; display: flex; flex-direction: column; gap: .5rem; }
.co-sheet-h { margin: 0 0 .25rem; font-size: .8rem; color: var(--au-muted); }
.co-source { display: flex; flex-direction: column; gap: .15rem; padding: .55rem .7rem; border: 1px solid var(--au-border); border-radius: 8px; cursor: pointer; font-size: .9rem; }
.co-source-d { font-family: var(--au-mono); font-size: .72rem; color: var(--au-muted); }
.co-source.co-soon { opacity: .5; cursor: default; }
.co-file { font-size: .78rem; margin-top: .35rem; }
.co-paste-input { font: inherit; font-family: var(--au-mono); font-size: .78rem; width: 100%; margin-top: .35rem; padding: .4rem .5rem; border: 1px solid var(--au-border); border-radius: 6px; background: var(--au-bg); color: var(--au-text); resize: vertical; }
.co-source .co-btn { align-self: flex-start; margin-top: .4rem; }
.co-paste-err { color: var(--au-error); font-size: .75rem; min-height: .5em; margin-top: .25rem; }

.co-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
.co-confirm { background: var(--au-surface); border: 1px solid var(--au-border); border-radius: 10px; padding: 1rem 1.1rem; max-width: 22rem; width: 100%; }
.co-confirm-h { margin: 0 0 .5rem; font-family: var(--au-mono); font-size: 1rem; }
.co-confirm-title { font-size: 1.05rem; margin-bottom: .15rem; }
.co-confirm-meta { font-family: var(--au-mono); font-size: .75rem; color: var(--au-muted); margin-bottom: 1rem; }
.co-confirm-actions { display: flex; gap: .5rem; justify-content: flex-end; }

.co-toast { position: fixed; left: 50%; bottom: 4.5rem; transform: translateX(-50%); background: var(--au-text); color: var(--au-bg); font-size: .8rem; padding: .5rem .9rem; border-radius: 6px; max-width: 90vw; z-index: 60; box-shadow: 0 2px 12px rgba(0,0,0,.3); }

.co-sync-body { display: flex; flex-direction: column; gap: .5rem; }
.co-sync-hint { font-size: .82rem; color: var(--au-muted); margin: 0; }
.co-sync-roles { display: flex; gap: .5rem; }
.co-sync-step { font-family: var(--au-mono); font-size: .78rem; color: var(--au-muted); }
.co-sync-status { font-size: .88rem; }
.co-sync-ok { color: var(--au-success); }
.co-sync-err { color: var(--au-error); }

.co-share .co-qr-wrap { display: flex; justify-content: center; margin: .25rem 0 .75rem; }
.co-qr { width: 12rem; height: 12rem; max-width: 100%; background: #fff; border: 6px solid #fff; border-radius: 6px; }
.co-share-toobig { color: var(--au-warn); font-size: .82rem; margin: .5rem 0 .75rem; }
.co-share-link { display: flex; gap: .4rem; margin-bottom: .6rem; }
.co-share-url { flex: 1; min-width: 0; font-family: var(--au-mono); font-size: .72rem; padding: .35rem .5rem; border: 1px solid var(--au-border); border-radius: 6px; background: var(--au-bg); color: var(--au-text); }

.co-list { display: flex; flex-direction: column; gap: .5rem; }
.co-formrow { display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left; font: inherit; padding: .7rem .8rem; border: 1px solid var(--au-border); border-radius: 8px; background: var(--au-surface); color: var(--au-text); cursor: pointer; }
.co-formmain { flex: 1; min-width: 0; }
.co-formtitle { font-size: .95rem; }
.co-formsub { font-family: var(--au-mono); font-size: .7rem; color: var(--au-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-count { font-family: var(--au-mono); font-size: .75rem; color: var(--au-muted); white-space: nowrap; }

.co-fillhead { display: flex; align-items: center; gap: .5rem; }
.co-back { font-size: 1.4rem; line-height: 1; border: none; background: none; color: var(--au-action); cursor: pointer; padding: 0 .3rem; }
.co-filltitle { font-family: var(--au-mono); font-size: 1.05rem; flex: 1; min-width: 0; }
.co-share-btn { font: inherit; font-size: .8rem; padding: .3rem .7rem; border: 1px solid var(--au-border); border-radius: 6px; background: var(--au-surface); color: var(--au-action); cursor: pointer; white-space: nowrap; }
.co-flash { font-size: .85rem; color: var(--au-success); background: var(--au-surface); border: 1px solid var(--au-border); border-radius: 6px; padding: .4rem .6rem; }

.co-group { font-family: var(--au-mono); font-size: .78rem; color: var(--au-muted); margin-top: .5rem; }
.co-rec { display: flex; align-items: center; gap: .5rem; padding: .5rem .7rem; border: 1px solid var(--au-border); border-radius: 6px; }
.co-rec-id { font-family: var(--au-mono); font-size: .8rem; }
.co-rec-state { margin-left: auto; font-size: .72rem; padding: .1rem .5rem; border-radius: 999px; }
.co-rec-state.ok { color: var(--au-success); border: 1px solid var(--au-success); }
.co-rec-state.warn { color: var(--au-warn); border: 1px solid var(--au-warn); }
.co-rec-att { font-size: .8rem; }
.co-rec-kind { font-family: var(--au-mono); font-size: .68rem; color: var(--au-muted); }
.co-rec-acts { display: inline-flex; gap: .35rem; }
.co-rec-act { font: inherit; font-size: .68rem; padding: .1rem .45rem; border: 1px solid var(--au-border); border-radius: 5px; background: none; color: var(--au-muted); cursor: pointer; }
.co-rec-act:hover { color: var(--au-text); border-color: var(--au-action); }
.co-btn.co-danger { background: var(--au-error); }   /* fault */
.co-sync-or { margin: .7rem 0 .35rem; font-size: .78rem; color: var(--au-muted); text-align: center; }
.co-sync-room { display: flex; gap: .5rem; }
.co-sync-roomid { flex: 1; font: inherit; padding: .45rem .55rem; border: 1px solid var(--au-border); border-radius: 6px; background: var(--au-surface); color: var(--au-text); }
.co-actions { display: flex; gap: .5rem; margin-top: 1rem; flex-wrap: wrap; }

.co-btn { font: inherit; font-size: .85rem; padding: .5rem .9rem; border: none; border-radius: 6px; background: var(--au-action); color: #fff; cursor: pointer; }

/* ── jig surface (schema-from-example builder) — plain; Switchboard polish later ── */
.jig-wrap { max-width: 72rem; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.jig-head { display: flex; align-items: baseline; gap: .6rem; }
.jig-brand { font-family: var(--au-mono); font-size: 1.1rem; letter-spacing: .02em; }
.jig-sub { color: var(--au-muted); font-size: .85rem; }
.jig-intake { display: flex; flex-direction: column; gap: .5rem; }
.jig-title, .jig-paste { font: inherit; padding: .5rem .6rem; border: 1px solid var(--au-border); border-radius: 6px; background: var(--au-surface); color: var(--au-text); }
.jig-paste { min-height: 5rem; font-family: var(--au-mono); font-size: .8rem; resize: vertical; }
.jig-intake-actions { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.jig-body { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
.jig-pane { flex: 1 1 22rem; min-width: 18rem; background: var(--au-surface); border: 1px solid var(--au-border); border-radius: 8px; padding: .8rem; }
.jig-pane-h, .jig-seams-h { font-family: var(--au-mono); font-size: .72rem; color: var(--au-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: .5rem; }
.jig-seams { margin-bottom: .8rem; }
.jig-seam { display: flex; flex-direction: column; gap: .3rem; padding: .5rem 0; border-bottom: 1px solid var(--au-border); }
.jig-seam-q { font-size: .85rem; }
.jig-seg-group { display: inline-flex; border: 1px solid var(--au-border); border-radius: 6px; overflow: hidden; }
.jig-seg { font: inherit; font-size: .8rem; padding: .35rem .85rem; background: var(--au-bg); color: var(--au-text); border: none; border-right: 1px solid var(--au-border); cursor: pointer; transition: background .12s, color .12s; }
.jig-seg:last-child { border-right: none; }
.jig-seg:hover { background: var(--au-surface); }
.jig-seg-on, .jig-seg-on:hover { background: var(--au-action); color: #fff; }   /* the chosen option, clearly filled */
.jig-seg-done { font-size: .8rem; color: var(--au-success); }   /* go */
.jig-done { margin-left: .5rem; font-size: .68rem; color: var(--au-success); font-family: var(--au-mono); letter-spacing: .03em; }
.jig-seam-done { opacity: .8; }
.jig-idrow { display: flex; align-items: center; gap: .5rem; margin-bottom: .6rem; }
.jig-idlabel { font-size: .8rem; color: var(--au-muted); }
.jig-field { display: flex; align-items: center; gap: .4rem; padding: .35rem 0; flex-wrap: wrap; }
.jig-field input, .jig-field select { font: inherit; font-size: .82rem; padding: .3rem .4rem; border: 1px solid var(--au-border); border-radius: 5px; background: var(--au-bg); color: var(--au-text); }
.jig-name { width: 8rem; font-family: var(--au-mono); }
.jig-label { width: 9rem; }
.jig-type { width: 7rem; }
.jig-ord { display: inline-flex; flex-direction: column; }
.jig-mini { padding: .05rem .35rem; font-size: .7rem; line-height: 1.1; background: none; color: var(--au-muted); border: 1px solid var(--au-border); }
.jig-del { color: var(--au-error); }
.jig-req { font-size: .75rem; color: var(--au-muted); display: inline-flex; align-items: center; gap: .2rem; }

          resolve(results);
        }
      };
      req.onerror = () => reject(req.error);
    });
  }

  async readFile(p, encoding) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (rec.type === 'directory') throw vfsError('EISDIR', np);
    if (encoding === 'bytes') {
      if (rec.content instanceof Uint8Array) return new Uint8Array(rec.content);
      return new TextEncoder().encode(rec.content || '');
    }
    if (rec.content instanceof Uint8Array) return new TextDecoder().decode(rec.content);
    return rec.content || '';
  }

  async writeFile(p, content) {
    const np = path.normalize(p);
    const parentPath = path.dirname(np);
    if (parentPath !== np) {
      const parent = await this._get(parentPath);
      if (!parent) throw vfsError('ENOENT', np);
      if (parent.type !== 'directory') throw vfsError('ENOTDIR', np);
    }
    const existing = await this._get(np);
    if (existing && existing.type === 'directory') throw vfsError('EISDIR', np);
    const now = new Date();
    const isBinary = content instanceof Uint8Array;
    const size = typeof content === 'string'
      ? new TextEncoder().encode(content).byteLength
      : (isBinary ? content.byteLength : 0);
    await this._put({
      path: np, type: 'file', content,
      size, created: existing ? existing.created : now, modified: now,
      mode: existing ? existing.mode : 0o644,
      owner: existing ? existing.owner : 'user',
      group: existing ? existing.group : 'staff',
      _binary: isBinary,
    });
  }

  async stat(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    return {
      type: rec.type,
      size: rec.size || 0,
      created: rec.created instanceof Date ? rec.created : new Date(rec.created),
      modified: rec.modified instanceof Date ? rec.modified : new Date(rec.modified),
      mode: rec.mode != null ? rec.mode : (rec.type === 'directory' ? 0o755 : 0o644),
      owner: rec.owner || 'user',
      group: rec.group || 'staff',
    };
  }

  async mkdir(p, opts) {
    const np = path.normalize(p);
    if (opts && opts.recursive) return this._mkdirRecursive(np);
    const parentPath = path.dirname(np);
    if (parentPath !== np) {
      const parent = await this._get(parentPath);
      if (!parent) throw vfsError('ENOENT', np);
    }
    const existing = await this._get(np);
    if (existing) throw vfsError('EEXIST', np);
    const now = new Date();
    await this._put({
      path: np, type: 'directory', content: null,
      size: 0, created: now, modified: now,
      mode: 0o755, owner: 'user', group: 'staff',
    });
  }

  async _mkdirRecursive(np) {
    const segs = np.split('/').filter(Boolean);
    let current = '';
    for (const seg of segs) {
      current += '/' + seg;
      const existing = await this._get(current);
      if (!existing) {
        const now = new Date();
        await this._put({
          path: current, type: 'directory', content: null,
          size: 0, created: now, modified: now,
          mode: 0o755, owner: 'user', group: 'staff',
        });
      }
    }
  }

  async readdir(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (rec.type !== 'directory') throw vfsError('ENOTDIR', np);

    const all = await this._scan(np);
    const prefix = np === '/' ? '/' : np + '/';
    const names = new Set();
    for (const entry of all) {
      const rel = entry.path.slice(prefix.length);
      if (!rel) continue;
      // Direct children only: no '/' in the remaining path
      const slashIdx = rel.indexOf('/');
      names.add(slashIdx === -1 ? rel : rel.slice(0, slashIdx));
    }
    return [...names].sort();
  }

  async rmdir(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (rec.type !== 'directory') throw vfsError('ENOTDIR', np);
    const children = await this.readdir(np);
    if (children.length > 0) throw vfsError('ENOTEMPTY', np);
    await this._del(np);
  }

  async unlink(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (rec.type === 'directory') throw vfsError('EISDIR', np);
    await this._del(np);
  }

  async rename(oldP, newP) {
    const oldNp = path.normalize(oldP);
    const newNp = path.normalize(newP);
    const rec = await this._get(oldNp);
    if (!rec) throw vfsError('ENOENT', oldNp);

    if (rec.type === 'directory') {
      // Move directory and all children
      const all = await this._scan(oldNp);
      const oldPrefix = oldNp === '/' ? '/' : oldNp + '/';
      const newPrefix = newNp === '/' ? '/' : newNp + '/';
      // Re-key all children
      for (const entry of all) {
        const newPath = newPrefix + entry.path.slice(oldPrefix.length);
        await this._del(entry.path);
        entry.path = newPath;
        await this._put(entry);
      }
      // Move the directory record itself
      await this._del(oldNp);
      rec.path = newNp;
      rec.modified = new Date();
      await this._put(rec);
    } else {
      await this._del(oldNp);
      rec.path = newNp;
      rec.modified = new Date();
      await this._put(rec);
    }
  }

  async touch(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (rec) {
      if (rec.type === 'file') {
        rec.modified = new Date();
        await this._put(rec);
      }
    } else {
      await this.writeFile(np, '');
    }
  }

  async chmod(p, mode) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    rec.mode = mode;
    await this._put(rec);
  }

  async chown(p, owner, group) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (owner !== undefined) rec.owner = owner;
    if (group !== undefined) rec.group = group;
    await this._put(rec);
  }

  async estimate() {
    if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      return { used: est.usage || 0, available: (est.quota || 0) - (est.usage || 0) };
    }
    // Fallback: sum record sizes
    const all = await this._scan('/');
    let used = 0;
    for (const entry of all) used += entry.size || 0;
    return { used, available: Infinity };
  }

  get persistent() { return true; }
  get estimatable() { return true; }
}

// -- comment.js --

class CommentBackend extends Backend {
  static type = 'comment';

  constructor(config) {
    super();
    this._map = new Map();
    this._commentNode = null;
    this._dataMode = !!(config && config.data);
    this._initData = (config && config.data) || null;
  }

  async init() {
    if (this._initData) {
      // Data mode: load from provided object
      for (const [key, entry] of Object.entries(this._initData)) {
        this._map.set(key, { ...entry });
      }
    } else if (typeof document !== 'undefined') {
      // DOM mode: find existing AUDITABLE-FS comment
      this._commentNode = this._findComment();
      if (this._commentNode) {
        const raw = this._commentNode.nodeValue.replace(/^AUDITABLE-FS\n/, '').replace(/\nAUDITABLE-FS$/, '');
        const obj = this._decode(raw);
        for (const [key, entry] of Object.entries(obj)) {
          this._map.set(key, entry);
        }
      }
    }
  }

  _findComment() {
    if (typeof document === 'undefined') return null;
    const walker = document.createTreeWalker(document, 128 /* NodeFilter.SHOW_COMMENT */);
    while (walker.nextNode()) {
      if (walker.currentNode.nodeValue.startsWith('AUDITABLE-FS\n')) {
        return walker.currentNode;
      }
    }
    return null;
  }

  _toRel(p) {
    // Strip leading / for internal storage
    const np = path.normalize(p);
    return np === '/' ? '' : np.slice(1);
  }

  _toAbs(rel) {
    return rel ? '/' + rel : '/';
  }

  _encode(obj) {
    const json = JSON.stringify(obj);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    // Split into 76-char lines
    const lines = [];
    for (let i = 0; i < b64.length; i += 76) {
      lines.push(b64.slice(i, i + 76));
    }
    return lines.join('\n');
  }

  _decode(raw) {
    const stripped = raw.replace(/\s/g, '');
    // Legacy raw JSON detection
    if (stripped.startsWith('{')) {
      return JSON.parse(stripped);
    }
    const json = decodeURIComponent(escape(atob(stripped)));
    return JSON.parse(json);
  }

  _syncComment() {
    if (!this._commentNode) return;
    const obj = Object.fromEntries(this._map);
    this._commentNode.nodeValue = 'AUDITABLE-FS\n' + this._encode(obj) + '\nAUDITABLE-FS';
  }

  async readFile(p, encoding) {
    const rel = this._toRel(p);
    const entry = this._map.get(rel);
    if (!entry) throw vfsError('ENOENT', p);

    let raw;
    if (entry.compressed && typeof DecompressionStream !== 'undefined') {
      // Decompress gzip base64
      const bytes = Uint8Array.from(atob(entry.data), c => c.charCodeAt(0));
      const ds = new DecompressionStream('gzip');
      const writer = ds.writable.getWriter();
      writer.write(bytes);
      writer.close();
      const reader = ds.readable.getReader();
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
      }
      const total = chunks.reduce((s, c) => s + c.byteLength, 0);
      const result = new Uint8Array(total);
      let offset = 0;
      for (const c of chunks) { result.set(c, offset); offset += c.byteLength; }
      raw = result;
    } else if (entry.data) {
      // Uncompressed base64
      const binary = atob(entry.data);
      raw = Uint8Array.from(binary, c => c.charCodeAt(0));
    } else {
      raw = new Uint8Array(0);
    }

    if (encoding === 'bytes') return raw;
    return new TextDecoder().decode(raw);
  }

  async writeFile(p, content) {
    const rel = this._toRel(p);
    // Verify parent directory exists (implicitly — check that we're not writing under a file)
    const parentRel = this._toRel(path.dirname(path.normalize(p)));
    if (parentRel) {
      // Check parent isn't a file
      if (this._map.has(parentRel)) throw vfsError('ENOTDIR', p);
    }

    let data, compressed = false, mimeType, size;

    if (content instanceof Uint8Array) {
      mimeType = path.mime(p);
      size = content.byteLength;
      // Try gzip compression in browser
      if (typeof CompressionStream !== 'undefined') {
        const cs = new CompressionStream('gzip');
        const writer = cs.writable.getWriter();
        writer.write(content);
        writer.close();
        const reader = cs.readable.getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const total = chunks.reduce((s, c) => s + c.byteLength, 0);
        const result = new Uint8Array(total);
        let offset = 0;
        for (const c of chunks) { result.set(c, offset); offset += c.byteLength; }
        if (result.byteLength < content.byteLength) {
          data = btoa(String.fromCharCode(...result));
          compressed = true;
        } else {
          data = btoa(String.fromCharCode(...content));
        }
      } else {
        data = btoa(String.fromCharCode(...content));
      }
    } else {
      const str = content || '';
      mimeType = path.mime(p);
      const bytes = new TextEncoder().encode(str);
      size = bytes.byteLength;
      if (typeof CompressionStream !== 'undefined') {
        const cs = new CompressionStream('gzip');
        const writer = cs.writable.getWriter();
        writer.write(bytes);
        writer.close();
        const reader = cs.readable.getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const total = chunks.reduce((s, c) => s + c.byteLength, 0);
        const result = new Uint8Array(total);
        let offset = 0;
        for (const c of chunks) { result.set(c, offset); offset += c.byteLength; }
        if (result.byteLength < bytes.byteLength) {
          data = btoa(String.fromCharCode(...result));
          compressed = true;
        } else {
          data = btoa(String.fromCharCode(...bytes));
        }
      } else {
        data = btoa(String.fromCharCode(...bytes));
      }
    }

    this._map.set(rel, { type: mimeType, compressed, size, data });
    this._syncComment();
  }

  async stat(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);

    // Root always exists
    if (rel === '') {
      return {
        type: 'directory', size: 0,
        created: new Date(0), modified: new Date(0),
        mode: 0o755, owner: 'user', group: 'staff',
      };
    }

    // Check if it's a file
    const entry = this._map.get(rel);
    if (entry) {
      return {
        type: 'file', size: entry.size || 0,
        created: new Date(0), modified: new Date(0),
        mode: 0o644, owner: 'user', group: 'staff',
      };
    }

    // Check if it's an implicit directory
    const prefix = rel + '/';
    for (const key of this._map.keys()) {
      if (key.startsWith(prefix)) {
        return {
          type: 'directory', size: 0,
          created: new Date(0), modified: new Date(0),
          mode: 0o755, owner: 'user', group: 'staff',
        };
      }
    }

    throw vfsError('ENOENT', np);
  }

  async mkdir(/* p, opts */) {
    // Implicit directories — mkdir is a no-op
  }

  async readdir(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);
    const prefix = rel ? rel + '/' : '';
    const names = new Set();

    for (const key of this._map.keys()) {
      if (rel === '') {
        // Root: all top-level entries
        const slashIdx = key.indexOf('/');
        names.add(slashIdx === -1 ? key : key.slice(0, slashIdx));
      } else if (key.startsWith(prefix)) {
        const rest = key.slice(prefix.length);
        if (!rest) continue;
        const slashIdx = rest.indexOf('/');
        names.add(slashIdx === -1 ? rest : rest.slice(0, slashIdx));
      }
    }

    return [...names].sort();
  }

  async rmdir(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);
    if (rel === '') throw vfsError('EACCES', np, 'cannot remove root');
    const children = await this.readdir(np);
    if (children.length > 0) throw vfsError('ENOTEMPTY', np);
    // No-op if empty (implicit directories have no record to delete)
  }

  async unlink(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);
    if (!this._map.has(rel)) throw vfsError('ENOENT', np);
    this._map.delete(rel);
    this._syncComment();
  }

  async rename(oldP, newP) {
    const oldRel = this._toRel(oldP);
    const newRel = this._toRel(newP);
    const entry = this._map.get(oldRel);
    if (!entry) throw vfsError('ENOENT', oldP);
    this._map.delete(oldRel);
    this._map.set(newRel, entry);
    this._syncComment();
  }

  async touch(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);
    if (!this._map.has(rel)) {
      // Create empty file
      this._map.set(rel, { type: path.mime(np), compressed: false, size: 0, data: '' });
      this._syncComment();
    }
    // No mtime to update in this format
  }

  async chmod() {
    // AUDITABLE-FS format doesn't store permissions — no-op
  }

  async chown() {
    // AUDITABLE-FS format doesn't store ownership — no-op
  }

  async export(basePath) {
    const np = path.normalize(basePath);
    const rel = this._toRel(np);
    const result = {};
    const prefix = rel ? rel + '/' : '';

    for (const [key, entry] of this._map) {
      let exportKey;
      if (rel === '') {
        exportKey = key;
      } else if (key.startsWith(prefix)) {
        exportKey = key.slice(prefix.length);
      } else if (key === rel) {
        // Exporting a single file
        const content = await this.readFile(np);
        return { [path.basename(np)]: content };
      } else {
        continue;
      }
      if (!exportKey) continue;
      result[exportKey] = entry;
    }
    return result;
  }

  async import(basePath, data) {
    const np = path.normalize(basePath);
    const rel = this._toRel(np);
    const prefix = rel ? rel + '/' : '';

    for (const [key, entry] of Object.entries(data)) {
      this._map.set(prefix + key, { ...entry });
    }
    this._syncComment();
  }

  getData() {
    return Object.fromEntries(this._map);
  }

  get persistent() { return true; }
  get portable() { return true; }
  get exportable() { return true; }
}

// -- handle.js --

class HandleBackend extends Backend {
  constructor(root) {
    super();
    this._root = root;
  }

  async _resolveDir(p) {
    const n = path.normalize(p);
    if (n === '/') return this._root;
    const segs = n.split('/').filter(Boolean);
    let dir = this._root;
    for (const seg of segs) {
      try {
        dir = await dir.getDirectoryHandle(seg);
      } catch {
        throw vfsError('ENOENT', p);
      }
    }
    return dir;
  }

  async _resolveFile(p, create) {
    const n = path.normalize(p);
    const parentPath = path.dirname(n);
    const name = path.basename(n);
    const dir = await this._resolveDir(parentPath);
    try {
      return await dir.getFileHandle(name, create ? { create: true } : undefined);
    } catch {
      throw vfsError('ENOENT', p);
    }
  }

  _resolveParent(p) {
    const n = path.normalize(p);
    return { dir: path.dirname(n), name: path.basename(n) };
  }

  async readFile(p, encoding) {
    const handle = await this._resolveFile(p);
    const file = await handle.getFile();
    if (encoding === 'bytes') {
      const buf = await file.arrayBuffer();
      return new Uint8Array(buf);
    }
    return await file.text();
  }

  async writeFile(p, content) {
    // Ensure parent exists (will throw ENOENT if not)
    const n = path.normalize(p);
    const parentPath = path.dirname(n);
    await this._resolveDir(parentPath);
    const handle = await this._resolveFile(p, true);
    const writable = await handle.createWritable();
    await writable.write(content);
    await writable.close();
  }

  async stat(p) {
    const n = path.normalize(p);
    if (n === '/') {
      return { type: 'directory', size: 0, created: new Date(0), modified: new Date(0) };
    }
    // Try file first
    try {
      const parentPath = path.dirname(n);
      const name = path.basename(n);
      const dir = await this._resolveDir(parentPath);
      const fh = await dir.getFileHandle(name);
      const file = await fh.getFile();
      return {
        type: 'file',
        size: file.size,
        created: new Date(file.lastModified),
        modified: new Date(file.lastModified),
      };
    } catch {
      // Try directory
      try {
        await this._resolveDir(n);
        return { type: 'directory', size: 0, created: new Date(0), modified: new Date(0) };
      } catch {
        throw vfsError('ENOENT', p);
      }
    }
  }

  async mkdir(p, opts) {
    const n = path.normalize(p);
    if (opts && opts.recursive) {
      const segs = n.split('/').filter(Boolean);
      let dir = this._root;
      for (const seg of segs) {
        dir = await dir.getDirectoryHandle(seg, { create: true });
      }
      return;
    }
    const parentPath = path.dirname(n);
    const name = path.basename(n);
    const parent = await this._resolveDir(parentPath);
    // Check if exists
    try {
      await parent.getDirectoryHandle(name);
      throw vfsError('EEXIST', p);
    } catch (e) {
      if (e.code === 'EEXIST') throw e;
    }
    await parent.getDirectoryHandle(name, { create: true });
  }

  async readdir(p) {
    const dir = await this._resolveDir(p);
    const names = [];
    for await (const [name] of dir.entries()) {
      names.push(name);
    }
    return names.sort();
  }

  async unlink(p) {
    const n = path.normalize(p);
    // Verify it's a file
    const info = await this.stat(p);
    if (info.type === 'directory') throw vfsError('EISDIR', p);
    const parentPath = path.dirname(n);
    const name = path.basename(n);
    const parent = await this._resolveDir(parentPath);
    await parent.removeEntry(name);
  }

  async rmdir(p) {
    const n = path.normalize(p);
    // Verify it's a directory
    const info = await this.stat(p);
    if (info.type !== 'directory') throw vfsError('ENOTDIR', p);
    const parentPath = path.dirname(n);
    const name = path.basename(n);
    const parent = await this._resolveDir(parentPath);
    await parent.removeEntry(name);
  }

  async rename(oldP, newP) {
    // No native rename in handle APIs — read, write, delete
    const info = await this.stat(oldP);
    if (info.type === 'directory') {
      // Recursive copy then delete
      await this._cpDir(oldP, newP);
      await this._rmDir(oldP);
    } else {
      const content = await this.readFile(oldP, 'bytes');
      await this.writeFile(newP, content);
      await this.unlink(oldP);
    }
  }

  async _cpDir(src, dst) {
    await this.mkdir(dst, { recursive: true });
    const entries = await this.readdir(src);
    for (const name of entries) {
      const srcChild = path.join(src, name);
      const dstChild = path.join(dst, name);
      const info = await this.stat(srcChild);
      if (info.type === 'directory') {
        await this._cpDir(srcChild, dstChild);
      } else {
        const content = await this.readFile(srcChild, 'bytes');
        await this.writeFile(dstChild, content);
      }
    }
  }

  async _rmDir(p) {
    const entries = await this.readdir(p);
    for (const name of entries) {
      const child = path.join(p, name);
      const info = await this.stat(child);
      if (info.type === 'directory') {
        await this._rmDir(child);
      } else {
        await this.unlink(child);
      }
    }
    await this.rmdir(p);
  }

  createReadStream(p) {
    // Return a thunk — caller must await the file handle resolution
    // For HandleBackend, return null and let subclass or consumer use readFile
    return null;
  }

  async createWriter(p) {
    const handle = await this._resolveFile(p, true);
    return handle.createWritable();
  }

  get persistent() { return true; }
  get streamable() { return true; }
  get estimatable() { return true; }

  async estimate() {
    if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      return { used: est.usage || 0, available: (est.quota || 0) - (est.usage || 0) };
    }
    return { used: 0, available: Infinity };
  }
}

// -- opfs.js --

class OPFSBackend extends HandleBackend {
  static type = 'opfs';

  constructor(config) {
    super(null);
    this._fallbackConfig = config && config.fallback;
    this._fallback = null;
  }

  toConfig() {
    // Real OPFS replicates fine: the worker gets its own origin-private
    // directory from navigator.storage.getDirectory() — same handle as
    // the main thread. When running in fallback mode (no OPFS available
    // in this context), we can't replicate because the fallback could
    // itself be non-replicable; let proc proxy instead.
    if (this._fallback) return null;
    return { type: 'opfs' };
  }

  async init() {
    if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.getDirectory) {
      this._root = await navigator.storage.getDirectory();
    } else if (this._fallbackConfig) {
      // Create fallback backend via the factory function set during build
      if (typeof _createBackend === 'function') {
        this._fallback = _createBackend(this._fallbackConfig);
      } else {
        // Standalone usage — try to construct directly
        throw vfsError('ENOTSUP', '/', 'OPFS not available and no backend factory');
      }
      if (this._fallback.init) await this._fallback.init();
    } else {
      throw vfsError('ENOTSUP', '/', 'OPFS not available');
    }
  }

  // Delegate all methods when in fallback mode
  async readFile(p, encoding) {
    if (this._fallback) return this._fallback.readFile(p, encoding);
    return super.readFile(p, encoding);
  }
  async writeFile(p, content) {
    if (this._fallback) return this._fallback.writeFile(p, content);
    return super.writeFile(p, content);
  }
  async stat(p) {
    if (this._fallback) return this._fallback.stat(p);
    return super.stat(p);
  }
  async mkdir(p, opts) {
    if (this._fallback) return this._fallback.mkdir(p, opts);
    return super.mkdir(p, opts);
  }
  async readdir(p) {
    if (this._fallback) return this._fallback.readdir(p);
    return super.readdir(p);
  }
  async rmdir(p) {
    if (this._fallback) return this._fallback.rmdir(p);
    return super.rmdir(p);
  }
  async unlink(p) {
    if (this._fallback) return this._fallback.unlink(p);
    return super.unlink(p);
  }
  async rename(oldP, newP) {
    if (this._fallback) return this._fallback.rename(oldP, newP);
    return super.rename(oldP, newP);
  }
  async touch(p) {
    if (this._fallback) return this._fallback.touch(p);
    return super.touch(p);
  }
  async exists(p) {
    if (this._fallback) return this._fallback.exists(p);
    return super.exists(p);
  }
  createReadStream(p) {
    if (this._fallback) return this._fallback.createReadStream(p);
    return super.createReadStream(p);
  }
  async createWriter(p) {
    if (this._fallback) return this._fallback.createWriter(p);
    return super.createWriter(p);
  }
  async estimate() {
    if (this._fallback) return this._fallback.estimate();
    return super.estimate();
  }
  async chmod(p, mode) {
    if (this._fallback && this._fallback.chmod) return this._fallback.chmod(p, mode);
    return super.chmod(p, mode);
  }
  async chown(p, owner, group) {
    if (this._fallback && this._fallback.chown) return this._fallback.chown(p, owner, group);
    return super.chown(p, owner, group);
  }
  async destroy() {
    if (this._fallback && this._fallback.destroy) return this._fallback.destroy();
  }
  async export(basePath) {
    if (this._fallback && this._fallback.export) return this._fallback.export(basePath);
    return super.export(basePath);
  }
  async import(basePath, data) {
    if (this._fallback && this._fallback.import) return this._fallback.import(basePath, data);
    return super.import(basePath, data);
  }

  // Capabilities delegate to fallback when active
  get persistent() { return this._fallback ? !!this._fallback.persistent : true; }
  get streamable() { return this._fallback ? !!this._fallback.streamable : true; }
  get estimatable() { return this._fallback ? !!this._fallback.estimatable : true; }
  get readonly() { return this._fallback ? !!this._fallback.readonly : false; }
  get portable() { return this._fallback ? !!this._fallback.portable : false; }
  get symlinks() { return this._fallback ? !!this._fallback.symlinks : false; }
}
