const _colorChars = { b: '#4488ff', g: '#44bb44', r: '#ee4444', c: '#44dddd', m: '#dd44dd', y: '#dddd44', k: '#000000', w: '#ffffff' };
const _markerChars = new Set(['o', 's', '^', 'v', '<', '>', 'd', '+', 'x', '.']);

function parseFormat(fmt) {
  if (!fmt || typeof fmt !== 'string') return {};
  const result = {};
  let i = 0;
  // check for color char
  if (_colorChars[fmt[i]]) {
    result.color = _colorChars[fmt[i]];
    i++;
  }
  // check for linestyle
  if (fmt[i] === '-') {
    if (fmt[i + 1] === '-') { result.linestyle = '--'; i += 2; }
    else if (fmt[i + 1] === '.') { result.linestyle = '-.'; i += 2; }
    else { result.linestyle = '-'; i++; }
  } else if (fmt[i] === ':') {
    result.linestyle = ':';
    i++;
  }
  // check for marker
  if (_markerChars.has(fmt[i])) {
    result.marker = fmt[i];
    i++;
  }
  return result;
}

function dashArray(linestyle) {
  switch (linestyle) {
    case '--': return [6, 4];
    case '-.': return [6, 2, 2, 2];
    case ':': return [2, 3];
    default: return [];
  }
}

// -- axes.js --

// Axes — trace storage, layout computation, canvas rendering





const _defaultColors = ['#c89b3c', '#5ba3b5', '#e07050', '#7a8b99', '#b5854b', '#5bb58b'];

// matplotlib short-form aliases — `c` for color, `ls` for linestyle,
// `lw` for linewidth, etc. We accept both, callers in the wild use
// either. Resolve into canonical names at trace ingress so renderers
// can read a single key.
const _ALIASES = {
  c: 'color',
  ls: 'linestyle',
  lw: 'linewidth',
  ms: 'markersize',
  mec: 'markeredgecolor',
  mfc: 'markerfacecolor',
  mew: 'markeredgewidth',
  // matplotlib's scatter() takes plural `edgecolors` / `linewidths`
  // (because it can color edges per-point); the rest of our renderer
  // reads singular. Alias both forms so user code that types plural
  // doesn't silently lose the edge.
  edgecolors: 'edgecolor',
  linewidths: 'linewidth',
};
function _resolveAliases(o) {
  if (!o) return o;
  for (const [a, k] of Object.entries(_ALIASES)) {
    if (o[a] !== undefined && o[k] === undefined) o[k] = o[a];
  }
  return o;
}

// Coerce inputs from various ndarray libraries (natra's WASM-arena
// descriptor, vec's data-backed shape, plain TypedArrays, native JS
// arrays, lists from adder) into a JS array we can iterate, spread,
// and Math.min/.max over. Used at every trace ingress so plt.hist /
// plt.plot / plt.bar etc. don't have to care about input shape.
function _toArr(x) {
  if (Array.isArray(x)) return x;
  if (x == null) return [];
  // natra adder wrapper: {_nd: true, _arr: <descriptor>}
  if (x._nd && x._arr) {
    const a = x._arr;
    if (a.memory && a.memory.buffer && a.dtype === 'f64' && typeof a.ptr === 'number') {
      return Array.from(new Float64Array(a.memory.buffer, a.ptr, a.length));
    }
    if (a.data) return Array.from(a.data.subarray ? a.data.subarray(0, a.length) : a.data);
  }
  // data-backed ndarray (vec / numpy-like)
  if (x.data && (x.data.buffer || ArrayBuffer.isView(x.data))) {
    return Array.from(x.data.length != null ? x.data.subarray ? x.data.subarray(0, x.length || x.data.length) : x.data : x.data);
  }
  // TypedArray / iterable
  if (ArrayBuffer.isView(x)) return Array.from(x);
  if (typeof x[Symbol.iterator] === 'function') return Array.from(x);
  return [x];
}

class Axes {
  constructor() {
    this._traces = [];
    this._title = null;
    this._xlabel = null;
    this._ylabel = null;
    this._xlim = null;
    this._ylim = null;
    this._grid = false;
    this._gridOpts = {};
    this._legend = false;
    this._legendOpts = {};
    this._colorbar = false;
    this._colorbarOpts = {};
    this._aspect = 'auto';
    this._colorIdx = 0;
  }

  _nextColor() {
    return _defaultColors[this._colorIdx++ % _defaultColors.length];
  }

  plot(x, y, fmtOrOpts, opts) {
    let o = {};
    if (typeof fmtOrOpts === 'string') {
      o = { ...parseFormat(fmtOrOpts), ...opts };
    } else if (fmtOrOpts) {
      o = { ...fmtOrOpts };
      if (o.fmt) Object.assign(o, parseFormat(o.fmt));
    }
    _resolveAliases(o);
    if (!o.color) o.color = this._nextColor();
    // Coerce series-shaped inputs (sadpan WrapperSeries, natra ndarray,
    // TypedArray, etc.) to plain JS arrays so the renderer's .length
    // and [i] reads work. Without this, `plt.plot(df['x'], df['y'])`
    // silently rendered nothing (WrapperSeries has no .length).
    this._traces.push({ type: 'line', x: _toArr(x), y: _toArr(y), opts: o });
    return this;
  }

  scatter(x, y, opts) {
    const o = _resolveAliases({ ...opts });
    if (!o.color) o.color = this._nextColor();
    // Same Series-coercion contract as plot(): a sadpan WrapperSeries
    // has no .length, so without _toArr the dot-render loop did
    // nothing and the axes auto-extent fell back to 0..1.
    this._traces.push({ type: 'scatter', x: _toArr(x), y: _toArr(y), opts: o });
    return this;
  }

  bar(x, heights, opts) {
    const o = _resolveAliases({ ...opts });
    if (!o.color) o.color = this._nextColor();
    this._traces.push({ type: 'bar', x: _toArr(x), heights: _toArr(heights), opts: o });
    return this;
  }

  barh(y, widths, opts) {
    const o = _resolveAliases({ ...opts });
    if (!o.color) o.color = this._nextColor();
    this._traces.push({ type: 'barh', y: _toArr(y), widths: _toArr(widths), opts: o });
    return this;
  }

  hist(data, opts) {
    const o = _resolveAliases({ ...opts });
    if (!o.color) o.color = this._nextColor();
    // Normalize data + bins to JS arrays so ndarray inputs (natra,
    // vec, TypedArrays) work the same as native lists.
    const dataArr = _toArr(data);
    if (o.bins != null && typeof o.bins !== 'number') o.bins = _toArr(o.bins);
    this._traces.push({ type: 'hist', data: dataArr, opts: o });
    return this;
  }

  // matshow — render a 2D matrix as a heatmap. Accepts diverse inputs:
  // a sadpan DataFrame (uses .to_numpy()), a natra ndarray, a
  // Float64Array with .shape, a nested JS array, or already-flat data
  // with shape. Extracts flat data + nx + ny + passes through to imshow.
  matshow(data, opts) {
    const o = _resolveAliases({ ...opts });
    let flat, nx, ny;
    // sadpan DataFrame
    if (data && data._tbl && typeof data.to_numpy === 'function') {
      const arr2d = data.to_numpy();
      ny = arr2d.shape[0];
      nx = arr2d.shape[1];
      flat = arr2d.data instanceof Float64Array ? arr2d.data : Float64Array.from([].concat(...arr2d.tolist()));
    } else if (data instanceof Float64Array && Array.isArray(data.shape) && data.shape.length === 2) {
      ny = data.shape[0]; nx = data.shape[1]; flat = data;
    } else if (data && data.data instanceof Float64Array && Array.isArray(data.shape) && data.shape.length === 2) {
      ny = data.shape[0]; nx = data.shape[1]; flat = data.data;
    } else if (data && data._nd && data._arr && data._arr.ndim === 2) {
      const a = data._arr;
      ny = a.shape[0]; nx = a.shape[1];
      flat = new Float64Array(a.memory.buffer, a.ptr, ny * nx);
    } else if (Array.isArray(data) && Array.isArray(data[0])) {
      ny = data.length;
      nx = data[0].length;
      flat = new Float64Array(ny * nx);
      for (let i = 0; i < ny; i++) for (let j = 0; j < nx; j++) flat[i * nx + j] = data[i][j];
    } else {
      // Fall back to imshow as-is and let it complain.
      return this.imshow(data, undefined, undefined, opts);
    }
    // matshow defaults to 'upper' origin (row 0 at top) — opposite of
    // imshow's default. honor unless caller explicitly set otherwise.
    if (!o.origin) o.origin = 'upper';
    // Aspect equal so cells render as squares.
    if (this._aspect === 'auto') this._aspect = 'equal';
    return this.imshow(flat, nx, ny, o);
  }

  imshow(data, nx, ny, opts) {
    this._traces.push({ type: 'imshow', data, nx, ny, opts: _resolveAliases({ ...opts }) });
    // default to equal aspect for grid data (matches matplotlib)
    if (this._aspect === 'auto') this._aspect = 'equal';
    return this;
  }

  axhline(y, opts) {
    this._traces.push({ type: 'hline', y, opts: _resolveAliases({ color: '#888', linewidth: 1, ...opts }) });
    return this;
  }

  axvline(x, opts) {
    this._traces.push({ type: 'vline', x, opts: _resolveAliases({ color: '#888', linewidth: 1, ...opts }) });
    return this;
  }

  // vlines(x, ymin, ymax) — vertical line segments. x can be scalar or
  // array. Implemented as line traces (x=[x_i,x_i] y=[ymin,ymax]) so no
  // new trace type is needed.
  vlines(x, ymin, ymax, opts) {
    const xs = _toArr(x);
    const o = _resolveAliases({ ...opts });
    if (!o.color && o.colors) o.color = Array.isArray(o.colors) ? o.colors[0] : o.colors;
    if (!o.color) o.color = this._nextColor();
    for (const xv of xs) {
      this._traces.push({ type: 'line', x: [xv, xv], y: [ymin, ymax], opts: { ...o } });
    }
    return this;
  }

  hlines(y, xmin, xmax, opts) {
    const ys = _toArr(y);
    const o = _resolveAliases({ ...opts });
    if (!o.color && o.colors) o.color = Array.isArray(o.colors) ? o.colors[0] : o.colors;
    if (!o.color) o.color = this._nextColor();
    for (const yv of ys) {
      this._traces.push({ type: 'line', x: [xmin, xmax], y: [yv, yv], opts: { ...o } });
    }
    return this;
  }

  text(x, y, text, opts) {
    this._traces.push({ type: 'text', x, y, text, opts: _resolveAliases({ color: '#ccc', fontsize: 11, ...opts }) });
    return this;
  }

  set_title(text, opts) { this._title = { text, opts }; return this; }
  set_xlabel(text, opts) { this._xlabel = { text, opts }; return this; }
  set_ylabel(text, opts) { this._ylabel = { text, opts }; return this; }
  set_xlim(lo, hi) {
    // matplotlib's set_xlim accepts either set_xlim(lo, hi) or set_xlim([lo, hi]).
    if (Array.isArray(lo) && hi === undefined) { hi = lo[1]; lo = lo[0]; }
    this._xlim = [lo, hi]; return this;
  }
  set_ylim(lo, hi) {
    if (Array.isArray(lo) && hi === undefined) { hi = lo[1]; lo = lo[0]; }
    this._ylim = [lo, hi]; return this;
  }
  set_xscale(scale) { this._xscale = scale; return this; }
  set_yscale(scale) { this._yscale = scale; return this; }
  set_zorder(_n) { /* z-order is per-trace; axes-level ordering not modelled */ return this; }
  set_aspect(aspect) { this._aspect = aspect; return this; }
  // twinx() — return a sister axes that shares this one's x-scale, has
  // its own y-scale, and renders overlaid in the same rect with its
  // y-axis on the right edge. Matches matplotlib's pyplot twinx for
  // dual-y plots (e.g. histogram on left axis, CDF on right axis).
  // The twin is NOT added to the figure's axes grid — its parent
  // renders it as part of its own _render pass.
  twinx() {
    const t = new Axes();
    t._twinOf = this;
    // Inherit x-scale settings so they stay in sync.
    t._xscale = this._xscale;
    t._xlim = this._xlim;
    this._twin = t;
    return t;
  }
  // twiny() in matplotlib shares y not x. Rare in practice; alias to
  // twinx for the common-case "I want two y-axes" intent.
  twiny() { return this.twinx(); }

  legend(opts) { this._legend = true; this._legendOpts = opts || {}; return this; }

  colorbar(opts) { this._colorbar = true; this._colorbarOpts = opts || {}; return this; }

  grid(on, opts) {
    this._grid = on !== false;
    if (opts) this._gridOpts = opts;
    return this;
  }

  // --- rendering ---

  _render(ctx, rect) {
    // Color theme — defaults come from the shared `_style` palette
    // (auditable-native dark unless `plt.style.use('default')` has
    // switched it). Per-Axes overrides (`_bgcolor`, `_textColor`,
    // `_gridColor`, `_frameColor`) still win for callers that want a
    // specific cell to render with custom colors.
    const bgcolor   = this._bgcolor   || _style.bgcolor;
    const textColor = this._textColor || _style.textColor;
    const gridColor = this._gridColor || _style.gridColor;
    const frameColor = this._frameColor || _style.frameColor;
    const font = '11px monospace';
    const smallFont = '10px monospace';

    // compute margins (smaller when tick labels are hidden — caller
    // sets _hideXTicks / _hideYTicks for compact grids like
    // scatter_matrix where inner subplots don't show ticks). Callers
    // that want all subplots in a grid to share a uniform plot area
    // (so cells line up regardless of which one carries the label)
    // pass `_margins = { left, right, top, bottom }` and bypass the
    // label/tick-driven computation.
    let ml, mr, mt, mb;
    if (this._margins) {
      ml = this._margins.left   ?? 42;
      mr = this._margins.right  ?? 12;
      mt = this._margins.top    ?? 8;
      mb = this._margins.bottom ?? 26;
    } else {
      ml = this._hideYTicks ? 6 : (this._ylabel ? 55 : 42);
      mr = this._colorbar ? 70 : 12;
      // Right-side twin axis needs space for its tick labels (+ optional ylabel).
      if (this._twin) mr = Math.max(mr, this._twin._ylabel ? 55 : 42);
      mt = this._title ? 24 : 8;
      mb = this._hideXTicks ? 6 : (this._xlabel ? 38 : 26);
    }

    let plotX = rect.x + ml;
    let plotY = rect.y + mt;
    let plotW = rect.x + rect.w - mr - plotX;
    let plotH = rect.y + rect.h - mb - plotY;
    if (plotW <= 0 || plotH <= 0) return;

    // Save the pre-aspect plot rect so colorbars and other "use the
    // full reserved height" annotations don't shrink along with the
    // shrunken plot area below.
    const fullPlotY = plotY;
    const fullPlotH = plotH;

    // compute data ranges
    let [xlo, xhi] = this._xlim || this._dataExtent('x');
    let [ylo, yhi] = this._ylim || this._dataExtent('y');
    if (xlo === xhi) { xlo -= 0.5; xhi += 0.5; }
    if (ylo === yhi) { ylo -= 0.5; yhi += 0.5; }

    // aspect ratio adjustment.
    // - For an imshow-dominated axes (matshow, correlation matrix, etc.)
    //   "equal" means the cells should be square — we SHRINK the plot
    //   rect to match data aspect, leaving figure bg around it. The old
    //   behavior (expand data range) painted bg-color stripes through
    //   the data area, which looks wrong for matrix plots.
    // - For scatter/line with aspect='equal', expanding the data range
    //   matches matplotlib's behavior (more breathing room around data).
    if (this._aspect === 'equal') {
      const dataW = xhi - xlo;
      const dataH = yhi - ylo;
      const scaleX = plotW / dataW;
      const scaleY = plotH / dataH;
      const hasImshow = this._traces.some(t => t.type === 'imshow');
      if (hasImshow) {
        const scale = Math.min(scaleX, scaleY);
        const newW = dataW * scale;
        const newH = dataH * scale;
        plotX += (plotW - newW) / 2;
        plotY += (plotH - newH) / 2;
        plotW = newW;
        plotH = newH;
      } else if (scaleX < scaleY) {
        const center = (ylo + yhi) / 2;
        const half = (plotH / scaleX) / 2;
        ylo = center - half;
        yhi = center + half;
      } else {
        const center = (xlo + xhi) / 2;
        const half = (plotW / scaleY) / 2;
        xlo = center - half;
        xhi = center + half;
      }
    }

    // Log scale needs strictly-positive bounds; clamp lo to the
    // smallest positive value present in the data (falling back to
    // hi/10 or 1e-9) so set_xscale('log') with auto-extent works on
    // lognormal-shaped data.
    function _logBounds(lo, hi) {
      let l = lo, h = hi;
      if (l <= 0) l = h > 0 ? h / 1e6 : 1e-9;
      if (h <= l) h = l * 10;
      return [l, h];
    }
    const _xScaleCls = this._xscale === 'log' ? LogScale : LinearScale;
    const _yScaleCls = this._yscale === 'log' ? LogScale : LinearScale;
    const [xloS, xhiS] = this._xscale === 'log' ? _logBounds(xlo, xhi) : [xlo, xhi];
    const [yloS, yhiS] = this._yscale === 'log' ? _logBounds(ylo, yhi) : [ylo, yhi];
    const xScale = new _xScaleCls([xloS, xhiS], [plotX, plotX + plotW]);
    const yScale = new _yScaleCls([yloS, yhiS], [plotY + plotH, plotY]); // y flipped

    // axes background
    ctx.fillStyle = bgcolor;
    ctx.fillRect(plotX, plotY, plotW, plotH);

    // grid
    if (this._grid) {
      ctx.strokeStyle = this._gridOpts.color || gridColor;
      ctx.lineWidth = 0.5;
      ctx.globalAlpha = this._gridOpts.alpha || 0.8;
      const xticks = xScale.ticks();
      const yticks = yScale.ticks();
      for (const v of xticks) {
        const px = xScale.transform(v);
        ctx.beginPath(); ctx.moveTo(px, plotY); ctx.lineTo(px, plotY + plotH); ctx.stroke();
      }
      for (const v of yticks) {
        const py = yScale.transform(v);
        ctx.beginPath(); ctx.moveTo(plotX, py); ctx.lineTo(plotX + plotW, py); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // render own traces (clipped to plot area)
    const lastCmapTrace = this._renderTraces(ctx, xScale, yScale, plotX, plotY, plotW, plotH);

    // render twin overlay (own traces + right-side y-axis), if present
    if (this._twin) {
      this._twin._renderAsTwin(ctx, xScale, plotX, plotY, plotW, plotH);
    }

    // axes frame
    ctx.strokeStyle = frameColor;
    ctx.lineWidth = 1;
    ctx.strokeRect(plotX, plotY, plotW, plotH);

    // ticks and labels
    ctx.fillStyle = textColor;
    ctx.font = smallFont;
    const xTicks = xScale.ticks();
    const yTicks = yScale.ticks();
    const xFmt = xScale.tickFormat();
    const yFmt = yScale.tickFormat();

    if (!this._hideXTicks) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (const v of xTicks) {
        const px = xScale.transform(v);
        ctx.beginPath(); ctx.moveTo(px, plotY + plotH); ctx.lineTo(px, plotY + plotH + 4); ctx.strokeStyle = frameColor; ctx.stroke();
        ctx.fillText(xFmt(v), px, plotY + plotH + 5);
      }
    }

    if (!this._hideYTicks) {
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (const v of yTicks) {
        const py = yScale.transform(v);
        ctx.beginPath(); ctx.moveTo(plotX - 4, py); ctx.lineTo(plotX, py); ctx.strokeStyle = frameColor; ctx.stroke();
        ctx.fillText(yFmt(v), plotX - 6, py);
      }
    }

    // title
    if (this._title) {
      ctx.fillStyle = textColor;
      ctx.font = '13px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(this._title.text, plotX + plotW / 2, plotY - 4);
    }

    // xlabel
    if (this._xlabel) {
      ctx.fillStyle = textColor;
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(this._xlabel.text, plotX + plotW / 2, plotY + plotH + 22);
    }

    // ylabel
    if (this._ylabel) {
      ctx.save();
      ctx.fillStyle = textColor;
      ctx.font = font;
      ctx.translate(rect.x + 14, plotY + plotH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(this._ylabel.text, 0, 0);
      ctx.restore();
    }

    // legend
    if (this._legend) {
      this._renderLegend(ctx, plotX, plotY, plotW, plotH);
    }

    // colorbar — pinned to the right edge of the cell rect (so it
    // stays on the figure's right side even when the plot rect itself
    // shrinks for aspect='equal'+imshow) and uses the full pre-aspect
    // plot height (so it doesn't shrink with the data area).
    if (this._colorbar && lastCmapTrace) {
      const cbW = 12;
      const cbX = rect.x + rect.w - mr + 10;
      let vmin, vmax, cmap;
      if (lastCmapTrace.type === 'imshow') {
        const d = lastCmapTrace.data;
        const nodata = lastCmapTrace.opts.nodata;
        let vals = nodata != null ? d.filter(v => v !== nodata) : d;
        vmin = lastCmapTrace.opts.vmin != null ? lastCmapTrace.opts.vmin : Math.min(...vals);
        vmax = lastCmapTrace.opts.vmax != null ? lastCmapTrace.opts.vmax : Math.max(...vals);
        cmap = lastCmapTrace.opts.cmap || 'viridis';
      } else {
        const c = lastCmapTrace.opts.c;
        vmin = lastCmapTrace.opts.vmin != null ? lastCmapTrace.opts.vmin : Math.min(...c);
        vmax = lastCmapTrace.opts.vmax != null ? lastCmapTrace.opts.vmax : Math.max(...c);
        cmap = lastCmapTrace.opts.cmap || 'viridis';
      }
      renderColorbar(ctx, cbX, fullPlotY, cbW, fullPlotH, cmap, vmin, vmax, {
        textColor, font: smallFont, label: this._colorbarOpts.label,
      });
    }
  }

  // Render this axes' traces into the given plot rect, clipped. Returns
  // the last trace that contributed a colormap (for colorbar rendering).
  // Extracted from _render so it can be shared with the twin overlay path.
  _renderTraces(ctx, xScale, yScale, plotX, plotY, plotW, plotH) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(plotX, plotY, plotW, plotH);
    ctx.clip();
    let lastCmapTrace = null;
    for (const trace of this._traces) {
      switch (trace.type) {
        case 'imshow': this._renderImshow(ctx, trace, xScale, yScale, plotX, plotY, plotW, plotH); lastCmapTrace = trace; break;
        case 'line': this._renderLine(ctx, trace, xScale, yScale); break;
        case 'scatter': this._renderScatter(ctx, trace, xScale, yScale); if (trace.opts.c && Array.isArray(trace.opts.c)) lastCmapTrace = trace; break;
        case 'bar': this._renderBar(ctx, trace, xScale, yScale, plotY + plotH); break;
        case 'barh': this._renderBarh(ctx, trace, xScale, yScale, plotX); break;
        case 'hist': this._renderHist(ctx, trace, xScale, yScale, plotY + plotH); break;
        case 'hline': this._renderHline(ctx, trace, xScale, yScale, plotX, plotW); break;
        case 'vline': this._renderVline(ctx, trace, xScale, yScale, plotY, plotH); break;
        case 'text': this._renderText(ctx, trace, xScale, yScale); break;
      }
    }
    ctx.restore();
    return lastCmapTrace;
  }

  // Render as a twin overlay — shares the parent's xScale, uses own
  // y-scale, draws the y-axis ticks/label on the right edge of the rect.
  // Title/xlabel/legend belong to parent; only y-state matters here.
  _renderAsTwin(ctx, parentXScale, plotX, plotY, plotW, plotH) {
    // Compute own y-scale (matches the path in _render but for the
    // overlay context — no aspect-ratio adjustment, no grid).
    let [ylo, yhi] = this._ylim || this._dataExtent('y');
    if (!isFinite(ylo) || !isFinite(yhi)) return;
    if (ylo === yhi) { ylo -= 0.5; yhi += 0.5; }
    let yloS = ylo, yhiS = yhi;
    if (this._yscale === 'log') {
      if (yloS <= 0) yloS = yhiS > 0 ? yhiS / 1e6 : 1e-9;
      if (yhiS <= yloS) yhiS = yloS * 10;
    }
    const _yScaleCls = this._yscale === 'log' ? LogScale : LinearScale;
    const yScale = new _yScaleCls([yloS, yhiS], [plotY + plotH, plotY]);

    // Render traces with parent's x-scale + own y-scale.
    this._renderTraces(ctx, parentXScale, yScale, plotX, plotY, plotW, plotH);

    // Right-edge y-axis: ticks + tick labels, drawn outside the plot rect.
    ctx.fillStyle = this._textColor || _style.textColor;
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const yTicks = yScale.ticks();
    const yFmt = yScale.tickFormat();
    for (const v of yTicks) {
      const py = yScale.transform(v);
      ctx.strokeStyle = this._frameColor || _style.frameColor;
      ctx.beginPath();
      ctx.moveTo(plotX + plotW, py);
      ctx.lineTo(plotX + plotW + 4, py);
      ctx.stroke();
      ctx.fillText(yFmt(v), plotX + plotW + 6, py);
    }

    // Right ylabel — rotated +90° (mirror of left ylabel's -90°)
    // so the text reads bottom-to-top on the right edge.
    if (this._ylabel) {
      ctx.save();
      ctx.fillStyle = this._textColor || _style.textColor;
      ctx.font = '11px monospace';
      ctx.translate(plotX + plotW + 38, plotY + plotH / 2);
      ctx.rotate(Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(this._ylabel.text, 0, 0);
      ctx.restore();
    }
  }

  _dataExtent(axis) {
    let lo = Infinity, hi = -Infinity;
    for (const trace of this._traces) {
      switch (trace.type) {
        case 'line':
        case 'scatter': {
          const arr = axis === 'x' ? trace.x : trace.y;
          for (let i = 0; i < arr.length; i++) {
            if (arr[i] < lo) lo = arr[i];
            if (arr[i] > hi) hi = arr[i];
          }
          break;
        }
        case 'bar': {
          if (axis === 'x') {
            for (const v of trace.x) { if (v < lo) lo = v; if (v > hi) hi = v; }
          } else {
            lo = Math.min(lo, 0);
            for (const v of trace.heights) { if (v > hi) hi = v; if (v < lo) lo = v; }
          }
          break;
        }
        case 'barh': {
          if (axis === 'y') {
            for (const v of trace.y) { if (v < lo) lo = v; if (v > hi) hi = v; }
          } else {
            lo = Math.min(lo, 0);
            for (const v of trace.widths) { if (v > hi) hi = v; if (v < lo) lo = v; }
          }
          break;
        }
        case 'hist': {
          const { bins: binEdges } = this._computeHistBins(trace);
          if (axis === 'x') {
            lo = Math.min(lo, binEdges[0]);
            hi = Math.max(hi, binEdges[binEdges.length - 1]);
          } else {
            const counts = this._computeHistCounts(trace);
            lo = Math.min(lo, 0);
            for (const c of counts) if (c > hi) hi = c;
          }
          break;
        }
        case 'imshow': {
          if (axis === 'x') { lo = Math.min(lo, 0); hi = Math.max(hi, trace.nx); }
          else {
            lo = Math.min(lo, 0); hi = Math.max(hi, trace.ny);
          }
          break;
        }
        case 'hline': {
          if (axis === 'y') { lo = Math.min(lo, trace.y); hi = Math.max(hi, trace.y); }
          break;
        }
        case 'vline': {
          if (axis === 'x') { lo = Math.min(lo, trace.x); hi = Math.max(hi, trace.x); }
          break;
        }
        case 'text': {
          if (axis === 'x') { lo = Math.min(lo, trace.x); hi = Math.max(hi, trace.x); }
          else { lo = Math.min(lo, trace.y); hi = Math.max(hi, trace.y); }
          break;
        }
      }
    }
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    // add padding for non-imshow
    const hasImshow = this._traces.some(t => t.type === 'imshow');
    if (!hasImshow && lo !== hi) {
      const pad = (hi - lo) * 0.05;
      lo -= pad;
      hi += pad;
    }
    return [lo, hi];
  }

  _computeHistBins(trace) {
    const data = trace.data;
    let bins = trace.opts.bins || 10;
    let edges;
    if (Array.isArray(bins)) {
      edges = bins;
    } else {
      const range = trace.opts.range;
      const lo = range ? range[0] : Math.min(...data);
      const hi = range ? range[1] : Math.max(...data);
      const step = (hi - lo) / bins;
      edges = [];
      for (let i = 0; i <= bins; i++) edges.push(lo + i * step);
    }
    return { bins: edges };
  }

  _computeHistCounts(trace) {
    const { bins: edges } = this._computeHistBins(trace);
    const counts = new Array(edges.length - 1).fill(0);
    for (const v of trace.data) {
      for (let i = 0; i < edges.length - 1; i++) {
        if (v >= edges[i] && (i === edges.length - 2 ? v <= edges[i + 1] : v < edges[i + 1])) {
          counts[i]++;
          break;
        }
      }
    }
    return counts;
  }

  // --- trace renderers ---

  _renderLine(ctx, trace, xScale, yScale) {
    const { x, y, opts } = trace;
    if (!x.length) return;
    ctx.strokeStyle = opts.color || '#c89b3c';
    ctx.lineWidth = opts.linewidth || 1.5;
    ctx.setLineDash(dashArray(opts.linestyle));
    ctx.beginPath();
    ctx.moveTo(xScale.transform(x[0]), yScale.transform(y[0]));
    for (let i = 1; i < x.length; i++) {
      ctx.lineTo(xScale.transform(x[i]), yScale.transform(y[i]));
    }
    ctx.stroke();
    ctx.setLineDash([]);
    // markers
    if (opts.marker) {
      this._drawMarkers(ctx, x, y, xScale, yScale, opts.marker, opts.color || '#c89b3c', opts.markersize || 4);
    }
  }

  _renderScatter(ctx, trace, xScale, yScale) {
    const { x, y, opts } = trace;
    const cArray = Array.isArray(opts.c);
    const cmapFn = cArray ? getCmap(opts.cmap || 'viridis') : null;
    let cMin, cMax;
    if (cArray) {
      cMin = opts.vmin != null ? opts.vmin : Math.min(...opts.c);
      cMax = opts.vmax != null ? opts.vmax : Math.max(...opts.c);
    }
    const sArray = Array.isArray(opts.s);
    // matplotlib's scatter default is s=20 (markersize in points²).
    // Our previous default (s=4) rendered ~4px-wide dots that were
    // hard to see at typical alpha values; bumping to 20 matches
    // matplotlib density and gives `scatter(x, y, alpha=0.2)` enough
    // pixel surface to be visible against a light figure bg.
    const defaultSize = typeof opts.s === 'number' ? opts.s : 20;
    const alpha = opts.alpha != null ? opts.alpha : 1;

    for (let i = 0; i < x.length; i++) {
      const px = xScale.transform(x[i]);
      const py = yScale.transform(y[i]);
      const r = sArray ? Math.sqrt(opts.s[i]) : Math.sqrt(defaultSize);
      ctx.globalAlpha = alpha;
      if (cArray) {
        const t = cMax !== cMin ? (opts.c[i] - cMin) / (cMax - cMin) : 0.5;
        ctx.fillStyle = cmapFn(t);
      } else {
        ctx.fillStyle = opts.c || opts.color || '#c89b3c';
      }
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
      if (opts.edgecolor) {
        ctx.strokeStyle = opts.edgecolor;
        ctx.lineWidth = opts.linewidth || 0.5;
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  _renderBar(ctx, trace, xScale, yScale, baseline) {
    const { x, heights, opts } = trace;
    const barW = opts.width || 0.8;
    ctx.fillStyle = opts.color || '#c89b3c';
    const alpha = opts.alpha != null ? opts.alpha : 1;
    ctx.globalAlpha = alpha;
    for (let i = 0; i < x.length; i++) {
      const px = xScale.transform(x[i] - barW / 2);
      const pw = xScale.transform(x[i] + barW / 2) - px;
      const py = yScale.transform(heights[i]);
      const py0 = yScale.transform(0);
      ctx.fillRect(px, py, pw, py0 - py);
      if (opts.edgecolor) {
        ctx.strokeStyle = opts.edgecolor;
        ctx.lineWidth = 1;
        ctx.strokeRect(px, py, pw, py0 - py);
      }
    }
    ctx.globalAlpha = 1;
  }

  _renderBarh(ctx, trace, xScale, yScale, left) {
    const { y, widths, opts } = trace;
    const barH = opts.height || 0.8;
    ctx.fillStyle = opts.color || '#c89b3c';
    const alpha = opts.alpha != null ? opts.alpha : 1;
    ctx.globalAlpha = alpha;
    for (let i = 0; i < y.length; i++) {
      const py = yScale.transform(y[i] + barH / 2);
      const ph = yScale.transform(y[i] - barH / 2) - py;
      const px0 = xScale.transform(0);
      const px = xScale.transform(widths[i]);
      ctx.fillRect(px0, py, px - px0, ph);
      if (opts.edgecolor) {
        ctx.strokeStyle = opts.edgecolor;
        ctx.lineWidth = 1;
        ctx.strokeRect(px0, py, px - px0, ph);
      }
    }
    ctx.globalAlpha = 1;
  }

  _renderHist(ctx, trace, xScale, yScale, baseline) {
    const { bins: edges } = this._computeHistBins(trace);
    const counts = this._computeHistCounts(trace);
    const alpha = trace.opts.alpha != null ? trace.opts.alpha : 0.8;
    ctx.fillStyle = trace.opts.color || '#c89b3c';
    ctx.globalAlpha = alpha;
    for (let i = 0; i < counts.length; i++) {
      const px0 = xScale.transform(edges[i]);
      const px1 = xScale.transform(edges[i + 1]);
      const py = yScale.transform(counts[i]);
      const py0 = yScale.transform(0);
      ctx.fillRect(px0, py, px1 - px0, py0 - py);
      if (trace.opts.edgecolor) {
        ctx.strokeStyle = trace.opts.edgecolor;
        ctx.lineWidth = 1;
        ctx.strokeRect(px0, py, px1 - px0, py0 - py);
      }
    }
    ctx.globalAlpha = 1;
  }

  _renderImshow(ctx, trace, xScale, yScale, plotX, plotY, plotW, plotH) {
    const { data, nx, ny, opts } = trace;
    const nodata = opts.nodata;
    const origin = opts.origin || 'lower';
    const cmapFn = getCmap(opts.cmap || 'viridis');

    // compute vmin/vmax
    let vmin = opts.vmin, vmax = opts.vmax;
    if (vmin == null || vmax == null) {
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < data.length; i++) {
        if (nodata != null && data[i] === nodata) continue;
        if (data[i] < lo) lo = data[i];
        if (data[i] > hi) hi = data[i];
      }
      if (vmin == null) vmin = lo;
      if (vmax == null) vmax = hi;
    }
    const vr = vmax - vmin || 1;

    for (let iy = 0; iy < ny; iy++) {
      for (let ix = 0; ix < nx; ix++) {
        const idx = iy * nx + ix;
        const v = data[idx];
        if (nodata != null && v === nodata) continue;
        // data y: origin='lower' → row 0 at y=0 (bottom), origin='upper' → row 0 at y=ny (top)
        const dataY = origin === 'lower' ? iy : (ny - 1 - iy);
        const px0 = xScale.transform(ix);
        const px1 = xScale.transform(ix + 1);
        const pyTop = yScale.transform(dataY + 1); // higher y → smaller pixel (top)
        const pyBot = yScale.transform(dataY);      // lower y → larger pixel (bottom)
        ctx.fillStyle = cmapFn((v - vmin) / vr);
        ctx.fillRect(px0, pyTop, px1 - px0 + 0.5, pyBot - pyTop + 0.5);
      }
    }
  }

  _renderHline(ctx, trace, xScale, yScale, plotX, plotW) {
    const py = yScale.transform(trace.y);
    ctx.strokeStyle = trace.opts.color;
    ctx.lineWidth = trace.opts.linewidth || 1;
    ctx.setLineDash(dashArray(trace.opts.linestyle));
    ctx.beginPath(); ctx.moveTo(plotX, py); ctx.lineTo(plotX + plotW, py); ctx.stroke();
    ctx.setLineDash([]);
  }

  _renderVline(ctx, trace, xScale, yScale, plotY, plotH) {
    const px = xScale.transform(trace.x);
    ctx.strokeStyle = trace.opts.color;
    ctx.lineWidth = trace.opts.linewidth || 1;
    ctx.setLineDash(dashArray(trace.opts.linestyle));
    ctx.beginPath(); ctx.moveTo(px, plotY); ctx.lineTo(px, plotY + plotH); ctx.stroke();
    ctx.setLineDash([]);
  }

  _renderText(ctx, trace, xScale, yScale) {
    const px = xScale.transform(trace.x);
    const py = yScale.transform(trace.y);
    ctx.fillStyle = trace.opts.color;
    ctx.font = `${trace.opts.fontsize || 11}px monospace`;
    ctx.textAlign = trace.opts.ha || 'left';
    ctx.textBaseline = trace.opts.va || 'bottom';
    ctx.fillText(trace.text, px, py);
  }

  _renderLegend(ctx, plotX, plotY, plotW, plotH) {
    const entries = [];
    for (const t of this._traces) {
      if (t.opts.label) entries.push({ label: t.opts.label, color: t.opts.color || '#c89b3c', type: t.type });
    }
    if (!entries.length) return;

    ctx.font = '10px monospace';
    const lineH = 14;
    const padding = 6;
    let maxW = 0;
    for (const e of entries) {
      const w = ctx.measureText(e.label).width;
      if (w > maxW) maxW = w;
    }
    const boxW = maxW + 24 + padding * 2;
    const boxH = entries.length * lineH + padding * 2;

    // position: default top-right
    const loc = this._legendOpts.loc || 'upper right';
    let lx, ly;
    if (loc.includes('right')) lx = plotX + plotW - boxW - 6;
    else if (loc.includes('left')) lx = plotX + 6;
    else lx = plotX + (plotW - boxW) / 2;
    if (loc.includes('upper') || loc.includes('top')) ly = plotY + 6;
    else if (loc.includes('lower') || loc.includes('bottom')) ly = plotY + plotH - boxH - 6;
    else ly = plotY + (plotH - boxH) / 2;

    ctx.fillStyle = _style.legendBg;
    ctx.fillRect(lx, ly, boxW, boxH);
    ctx.strokeStyle = _style.legendBorder;
    ctx.lineWidth = 0.5;
    ctx.strokeRect(lx, ly, boxW, boxH);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < entries.length; i++) {
      const ey = ly + padding + i * lineH + lineH / 2;
      ctx.fillStyle = entries[i].color;
      if (entries[i].type === 'scatter') {
        ctx.beginPath(); ctx.arc(lx + padding + 6, ey, 3, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillRect(lx + padding, ey - 1, 14, 2);
      }
      ctx.fillStyle = _style.textColor;
      ctx.fillText(entries[i].label, lx + padding + 18, ey);
    }
  }

  _drawMarkers(ctx, x, y, xScale, yScale, marker, color, size) {
    ctx.fillStyle = color;
    const r = size / 2;
    for (let i = 0; i < x.length; i++) {
      const px = xScale.transform(x[i]);
      const py = yScale.transform(y[i]);
      switch (marker) {
        case 'o': case '.':
          ctx.beginPath(); ctx.arc(px, py, marker === '.' ? 1.5 : r, 0, Math.PI * 2); ctx.fill(); break;
        case 's':
          ctx.fillRect(px - r, py - r, size, size); break;
        case '^':
          ctx.beginPath(); ctx.moveTo(px, py - r); ctx.lineTo(px - r, py + r); ctx.lineTo(px + r, py + r); ctx.closePath(); ctx.fill(); break;
        case 'v':
          ctx.beginPath(); ctx.moveTo(px, py + r); ctx.lineTo(px - r, py - r); ctx.lineTo(px + r, py - r); ctx.closePath(); ctx.fill(); break;
        case 'd':
          ctx.beginPath(); ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py); ctx.closePath(); ctx.fill(); break;
        case '+':
          ctx.strokeStyle = color; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(px - r, py); ctx.lineTo(px + r, py); ctx.moveTo(px, py - r); ctx.lineTo(px, py + r); ctx.stroke(); break;
        case 'x':
          ctx.strokeStyle = color; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(px - r, py - r); ctx.lineTo(px + r, py + r); ctx.moveTo(px + r, py - r); ctx.lineTo(px - r, py + r); ctx.stroke(); break;
        default:
          ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}

// Figure — canvas management, subplot grid, DPI handling



class Figure {
  constructor(nrows, ncols, opts) {
    this.nrows = nrows || 1;
    this.ncols = ncols || 1;
    const o = opts || {};
    // matplotlib's figsize is in INCHES; the canvas pixel size is
    // figsize * dpi. Default dpi 100. Notebooks like Pyrcz's pass
    // figsize=(7, 7) expecting a 700×700 canvas — without this scale
    // we'd produce a 7×7 px (effectively invisible) canvas.
    //
    // Heuristic: if both dims are ≤ 50, assume inches and scale by
    // dpi. If either is > 50, assume already-pixels (back-compat with
    // JS-side callers that pass pixel values directly).
    const rawSize = o.figsize || [4, 3];
    const dpi = o.dpi || 100;
    const inchesShape = rawSize[0] <= 50 && rawSize[1] <= 50;
    this.width = inchesShape ? rawSize[0] * dpi : rawSize[0];
    this.height = inchesShape ? rawSize[1] * dpi : rawSize[1];
    // Figure facecolor — pulled from the style palette unless explicitly
    // overridden. Dark palette uses 'transparent' (notebook bg shows
    // through); light palette uses an opaque off-white card so dark
    // tick text contrasts even on a dark notebook bg.
    this.facecolor = o.facecolor || _style.figureFacecolor;
    this._suptitle = null;
    // Inter-subplot gap in pixels. Callers that want a tight grid
    // (e.g. sadpan's scatter_matrix on a small figure) pass `gap` (or
    // matplotlib's wspace/hspace) in opts. wspace/hspace land in pixels
    // here; matplotlib's fraction-of-axis-width semantics aren't worth
    // emulating for our flat-layout use case.
    this._gapX = (o.wspace ?? o.gap ?? 10);
    this._gapY = (o.hspace ?? o.gap ?? 10);
    // Figure-level row/col labels — drawn OUTSIDE the subplot grid
    // (to the left of each row and below each column). Used by
    // matrix-shaped plots like sadpan's scatter_matrix where the
    // column names belong on the figure edges, not duplicated as
    // per-cell axis labels.
    this._rowLabels = null;
    this._colLabels = null;

    // create axes grid
    this.axes = [];
    for (let i = 0; i < this.nrows * this.ncols; i++) {
      this.axes.push(new Axes());
    }
  }

  suptitle(text, opts) {
    this._suptitle = { text, opts };
    return this;
  }

  // matplotlib's Figure.subplots_adjust(left, right, top, bottom,
  // wspace, hspace) — adjusts margins between subplots. We don't
  // currently honor these (our subplot layout uses fixed gaps); accept
  // and discard so notebooks that call `fig.subplots_adjust(wspace=0.7)`
  // proceed instead of erroring with no-attribute.
  subplots_adjust(_opts) { return this; }
  tight_layout(_opts) { return this; }

  show() {
    const dpr = (typeof window !== 'undefined' ? window.devicePixelRatio : 1) || 1;
    const canvas = (typeof document !== 'undefined') ? document.createElement('canvas') : null;
    if (!canvas) return null;

    canvas.width = this.width * dpr;
    canvas.height = this.height * dpr;
    canvas.style.width = this.width + 'px';
    canvas.style.height = this.height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // background
    if (this.facecolor !== 'transparent') {
      ctx.fillStyle = this.facecolor;
      ctx.fillRect(0, 0, this.width, this.height);
    }

    // suptitle space
    const supH = this._suptitle ? 24 : 0;

    if (this._suptitle) {
      ctx.fillStyle = _style.textColor;
      ctx.font = '14px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(this._suptitle.text, this.width / 2, 4);
    }

    // Figure-level row/col label gutters. Reserve space outside the
    // subplot grid for these labels so the grid itself shrinks rather
    // than overlapping the labels.
    const rowLabelW = this._rowLabels ? 28 : 0;
    const colLabelH = this._colLabels ? 18 : 0;

    // subplot layout — grid origin shifted by the row-label gutter
    const gapX = this._gapX;
    const gapY = this._gapY;
    const gridX = rowLabelW;
    const gridY = supH;
    const gridW = this.width - rowLabelW;
    const gridH = this.height - supH - colLabelH;
    const cellW = (gridW - gapX * (this.ncols - 1)) / this.ncols;
    const cellH = (gridH - gapY * (this.nrows - 1)) / this.nrows;

    for (let r = 0; r < this.nrows; r++) {
      for (let c = 0; c < this.ncols; c++) {
        const idx = r * this.ncols + c;
        const ax = this.axes[idx];
        const rect = {
          x: gridX + c * (cellW + gapX),
          y: gridY + r * (cellH + gapY),
          w: cellW,
          h: cellH,
        };
        ax._render(ctx, rect);
      }
    }

    // Figure-level edge labels — drawn after subplots so they sit on
    // top of any background fill. Row labels rotate -90° (read bottom-
    // to-top), centered vertically on each row. Col labels read flat,
    // centered horizontally under each column.
    if (this._rowLabels) {
      ctx.save();
      ctx.fillStyle = _style.textColor;
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let r = 0; r < this.nrows; r++) {
        const label = this._rowLabels[r];
        if (!label) continue;
        const cy = gridY + r * (cellH + gapY) + cellH / 2;
        ctx.save();
        ctx.translate(rowLabelW / 2, cy);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(label, 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }
    if (this._colLabels) {
      ctx.fillStyle = _style.textColor;
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let c = 0; c < this.ncols; c++) {
        const label = this._colLabels[c];
        if (!label) continue;
        const cx = gridX + c * (cellW + gapX) + cellW / 2;
        const cy = gridY + gridH + colLabelH / 2;
        ctx.fillText(label, cx, cy);
      }
    }

    return canvas;
  }

  savefig(filename) {
    const canvas = this.show();
    if (!canvas) return;

  return { codec: compactCodecName(body[0]), dictId: null, payload: body.slice(1), base: 'b64' };
}

function parseCompactQ(body) {
  // body = "<codec-char>[.<dict-id>_]<payload>" — q: is the only compact form
  // with dictionary support (§6.4). The terminating `_` is unambiguous because
  // `_` is neither in the base45 alphabet nor a legal dict-id character (§12.1).
  if (!body) throw new Error('EDECODE');
  let codec = compactCodecName(body[0]);
  let rest = body.slice(1);
  let dictId = null;
  // Dict prefix is `.<dict-id>_` — but `.` is ALSO a base45 character, so a
  // plain payload can legitimately start with `.`. The disambiguator is `_`:
  // it is NOT in the base45 alphabet, so its presence unambiguously marks a
  // dict prefix. A leading `.` with no following `_` is just base45 data.
  if (rest[0] === '.' && rest.includes('_')) {
    const us = rest.indexOf('_');
    dictId = rest.slice(1, us);
    if (!dictId) throw new Error('EDECODE');
    rest = rest.slice(us + 1);
    if (codec !== 'deflate') throw new Error('EUNSUPPORTEDCODEC'); // dict is deflate-only for now
    codec = 'deflate-dict';
  }
  return { codec, dictId, payload: rest, base: 'b45' };
}

const PARSERS = { inline: parseLong, i: parseCompactI, q: parseCompactQ };

async function decodeParts(parts, ctx) {
  const { codec, dictId, payload, base } = parts;
  let bytes;
  try { bytes = base === 'b45' ? base45ToBytes(payload) : b64UrlToBytes(payload); }
  catch { throw new Error('EDECODE'); }

  if (codec === 'raw') return bytes;
  if (codec === 'brotli') throw new Error('EUNSUPPORTEDCODEC'); // optional, not implemented
  if (codec === 'deflate') return inflateRaw(bytes);
  if (codec === 'deflate-dict') {
    const cfg = (ctx && ctx.options && ctx.options.inline) || {};
    const dict = cfg.dictionaries && cfg.dictionaries[dictId];
    if (!dict) throw new Error('EUNSUPPORTEDCODEC'); // dict not registered → decline (§12)
    return inflateRaw(bytes, { dictionary: toU8(dict), backend: cfg.backend });
  }
  throw new Error('EUNSUPPORTEDCODEC');
}

/** Build a Loader bound to one inline scheme/form. */
function makeInlineLoader(form) {
  const parse = PARSERS[form];
  if (!parse) throw new Error('programmer error: unknown inline form ' + form);
  return async (body, ctx) => decodeParts(parse(body), ctx);
}

const inlineLoader = makeInlineLoader('inline'); // scheme: inline
const iLoader = makeInlineLoader('i');           // scheme: i
const qLoader = makeInlineLoader('q');           // scheme: q

/**
 * Standalone inline decode — parse the scheme ourselves and dispatch.
 * `opts` may carry { dictionaries, backend } directly (wrapped into the
 * ctx shape the loaders expect). Returns Uint8Array.
 */
async function decodeInline(capsule, opts = {}) {
  let p = capsule.startsWith('#') ? capsule.slice(1) : capsule;
  const c = p.indexOf(':');
  if (c < 0) throw new Error('ENOSCHEME');
  const scheme = p.slice(0, c);
  const body = p.slice(c + 1);
  if (!PARSERS[scheme]) throw new Error('EUNKNOWN');
  const ctx = { options: { inline: { dictionaries: opts.dictionaries, backend: opts.backend } } };
  return decodeParts(PARSERS[scheme](body), ctx);
}

// ===== src/loaders/url.js ==============================================
// @gcu/capsule — `url:` loader (SPEC-capsule §7.1).
// Body is a percent-encoded absolute HTTPS URL. HTTPS only; never follow an
// HTTPS→HTTP downgrade. The escape hatch for any CORS-open host not covered
// by a named scheme.

const urlLoader = async (body, ctx) => {
  let target;
  try { target = decodeURIComponent(body); } catch { throw new Error('EDECODE'); }
  let u;
  try { u = new URL(target); } catch { throw new Error('EDECODE'); }
  if (u.protocol !== 'https:') throw new Error('EFETCH'); // non-HTTPS rejected (§7.1)
  return fetchBytes(u.href, ctx);
};

// ===== src/loaders/gh.js ===============================================
// @gcu/capsule — `gh:` loader (SPEC-capsule §7.2).
//   gh:<owner>/<repo>[@<ref>]:<path>
// Fetches via jsDelivr by default (stable, cached) or raw.githubusercontent
// when ctx.options.gh.endpoint === 'raw'. ref defaults to HEAD.

const ghLoader = async (body, ctx = {}) => {
  // Split owner/repo[@ref] from path at the FIRST ':' — paths can't contain ':'
  // in this grammar, and refs/owners/repos can't either.
  const colon = body.indexOf(':');
  if (colon < 0) throw new Error('EDECODE');
  const locator = body.slice(0, colon);
  const path = body.slice(colon + 1);
  if (!path) throw new Error('EDECODE');

  let repoPart = locator, ref = 'HEAD';
  const at = locator.indexOf('@');
  if (at >= 0) { repoPart = locator.slice(0, at); ref = locator.slice(at + 1) || 'HEAD'; }

  const slash = repoPart.indexOf('/');
  if (slash < 0) throw new Error('EDECODE');
  const owner = repoPart.slice(0, slash);
  const repo = repoPart.slice(slash + 1);
  if (!owner || !repo) throw new Error('EDECODE');

  const endpoint = (ctx.options && ctx.options.gh && ctx.options.gh.endpoint) || 'jsdelivr';
  const url = endpoint === 'raw'
    ? `https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${path}`
    : `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${ref}/${path}`;
  return fetchBytes(url, ctx);
};

// ===== src/loaders/gist.js =============================================
// @gcu/capsule — `gist:` loader (SPEC-capsule §7.3).
//   gist:<id>[:<file>]
// Fetches the gist API, returns the named file, else the first file matching
// a shell-supplied default extension, else the first file. Falls back to the
// file's raw_url when the API reports it truncated.

const gistLoader = async (body, ctx = {}) => {
  const colon = body.indexOf(':');
  const id = colon < 0 ? body : body.slice(0, colon);
  const wanted = colon < 0 ? null : body.slice(colon + 1);
  if (!id) throw new Error('EDECODE');

  const meta = await fetchJson(`https://api.github.com/gists/${id}`, ctx);
  const files = meta && meta.files;
  if (!files || typeof files !== 'object') throw new Error('ENOTFOUND');
  const names = Object.keys(files);
  if (names.length === 0) throw new Error('ENOTFOUND');

  let pick = null;
  if (wanted) {
    pick = files[wanted];
    if (!pick) throw new Error('ENOTFOUND');
  } else {
    const defExt = ctx.options && ctx.options.gist && ctx.options.gist.defaultExt;
    if (defExt) pick = files[names.find(n => n.endsWith(defExt))];
    if (!pick) pick = files[names[0]];
  }

  if (pick.truncated && pick.raw_url) return fetchBytes(pick.raw_url, ctx);
  return new TextEncoder().encode(pick.content != null ? pick.content : '');
};

// ===== src/loaders/zenodo.js ===========================================
// @gcu/capsule — `zenodo:` loader (SPEC-capsule §7.4).
//   zenodo:<record-id>[:<file>]
// Fetches the record, then the named file's content endpoint. File selection
// when omitted mirrors gist (default-ext, then first file). Pinning is the
// caller's concern: use a version-specific record id (§7.4).

const zenodoLoader = async (body, ctx = {}) => {
  const colon = body.indexOf(':');
  const id = colon < 0 ? body : body.slice(0, colon);
  const wanted = colon < 0 ? null : body.slice(colon + 1);
  if (!id) throw new Error('EDECODE');

  const rec = await fetchJson(`https://zenodo.org/api/records/${id}`, ctx);
  const files = (rec && rec.files) || [];
  if (!Array.isArray(files) || files.length === 0) throw new Error('ENOTFOUND');

  const keyOf = f => f.key || f.filename || (f.links && f.links.self && f.links.self.split('/').pop());
  let pick = null;
  if (wanted) {
    pick = files.find(f => keyOf(f) === wanted);
    if (!pick) throw new Error('ENOTFOUND');
  } else {
    const defExt = ctx.options && ctx.options.zenodo && ctx.options.zenodo.defaultExt;
    if (defExt) pick = files.find(f => (keyOf(f) || '').endsWith(defExt));
    if (!pick) pick = files[0];
  }

  const key = keyOf(pick);
  const contentUrl = (pick.links && (pick.links.content || pick.links.download))
    || `https://zenodo.org/api/records/${id}/files/${encodeURIComponent(key)}/content`;
  return fetchBytes(contentUrl, ctx);
};

// ===== src/loaders/doi.js ==============================================
// @gcu/capsule — `doi:` loader (SPEC-capsule §7.5).
//   doi:<prefix>/<suffix>[#<file>]
// Resolves the DOI to its hosting system and delegates to a recognized
// downstream loader (currently Zenodo) via ctx.resolve. The `#file` suffix
// (inside the capsule body, not a second URL fragment) becomes the file
// selector for the downstream scheme. Unknown hosts → EUNSUPPORTEDDOI.

const doiLoader = async (body, ctx = {}) => {
  let name = body, file = null;
  const hash = body.indexOf('#');
  if (hash >= 0) { name = body.slice(0, hash); file = body.slice(hash + 1); }
  if (!name.includes('/')) throw new Error('EDECODE');

  let res;
  try {
    res = await fetch(`https://doi.org/${name}`, {
      method: 'GET', redirect: 'follow', credentials: 'same-origin', signal: ctx.signal,
    });
  } catch (e) {
    if (e && e.name === 'AbortError') throw e;
    throw new Error('EFETCH');
  }
  const dest = res.url || '';

  // Zenodo: .../record(s)/<id> — hand off to the zenodo scheme through the
  // dispatcher so its file-selection + content endpoint logic is reused.
  const z = dest.match(/zenodo\.org\/(?:record|records)\/(\d+)/);
  if (z) {
    if (typeof ctx.resolve !== 'function') throw new Error('EUNSUPPORTEDDOI');
    return ctx.resolve('zenodo:' + z[1] + (file ? ':' + file : ''));
  }
  throw new Error('EUNSUPPORTEDDOI'); // unrecognized host — caller may retry with url:
};

// ===== src/loaders/rentry.js ===========================================
// @gcu/capsule — `rentry:` loader (SPEC-capsule §7.6).
//   rentry:<paste-id>  →  https://rentry.co/<paste-id>/raw
// Rentry pastes are public; producers should label that at publication (§14).

const rentryLoader = async (body, ctx) => {
  if (!/^[A-Za-z0-9_-]+$/.test(body)) throw new Error('EDECODE');
  return fetchBytes(`https://rentry.co/${body}/raw`, ctx);
};

// ===== src/encode.js ===================================================
// @gcu/capsule — inline encoding (bytes/text → capsule). Split out so the
// share helpers (src/share.js) can reuse it without importing index.js.

const COMPACT_CHAR = { raw: 'r', deflate: 'd' };

/**
 * Encode content as an inline capsule.
 *
 * @param {Uint8Array|ArrayBuffer|string} content  string is UTF-8 encoded.
 * @param {object} [opts]
 *   form:    'i' (default) | 'q' | 'inline'   — compact / QR / long
 *   codec:   'deflate' (default) | 'raw'
 *   dictId:  dictionary id → uses deflate-dict.<id> (q: or inline: only)
 *   dictionary: Uint8Array dictionary bytes (required when dictId is set)
 *   backend: pako-shaped { deflateRaw, inflateRaw } for the dictionary path
 * @returns {Promise<string>} the capsule string (NOT fragment-escaped; wrap
 *   with fragmentEncode when placing in a URL fragment).
 */
async function encodeInline(content, opts = {}) {
  const form = opts.form || 'i';
  const codec = opts.codec || 'deflate';
  const bytes = typeof content === 'string' ? new TextEncoder().encode(content) : toU8(content);

  if (opts.dictId) {
    if (codec !== 'deflate') throw new Error('EUNSUPPORTEDCODEC');
    if (form === 'i') throw new Error('EUNSUPPORTEDCODEC'); // i: has no dict form (§6.3)
    const comp = await deflateRaw(bytes, { dictionary: opts.dictionary, backend: opts.backend });
    if (form === 'q') return `q:d.${opts.dictId}_` + bytesToBase45(comp);
    return `inline:deflate-dict.${opts.dictId}:` + bytesToB64Url(comp); // long form
  }

  const payloadBytes = codec === 'raw' ? bytes : await deflateRaw(bytes);
  if (form === 'q') return 'q:' + COMPACT_CHAR[codec] + bytesToBase45(payloadBytes);
  if (form === 'inline') return `inline:${codec}:` + bytesToB64Url(payloadBytes);
  return 'i:' + COMPACT_CHAR[codec] + bytesToB64Url(payloadBytes); // compact default
}

/** Decode an inline capsule to text (UTF-8). Convenience over decodeInline. */
async function decodeInlineText(capsule, opts) {
  return new TextDecoder().decode(await decodeInline(capsule, opts));
}

// ===== src/dispatcher.js ===============================================
// @gcu/capsule — dispatcher (SPEC-capsule §5, §9, §16).
//
// The glue between a capsule string and the loaders. createDispatcher()
// returns a registry pre-wired with all reserved schemes (§3.1); register()
// overwrites (so a shell can swap in a customized loader, e.g. an authed
// gh:), unregister() removes (subsequent resolve → EUNKNOWN). resolve()
// splits the capsule at the first ':', looks up the loader, and invokes it
// with a full ResolutionContext (including a `resolve` back-reference so
// loaders like doi: can delegate).

function createDispatcher(init = {}) {
  const loaders = new Map();
  const baseOptions = init.options || {};
  const baseOrigin = init.origin
    || (typeof location !== 'undefined' ? location.origin : undefined);

  function resolve(capsule, ctxOverride = {}) {
    let trimmed = capsule && capsule.startsWith('#') ? capsule.slice(1) : capsule;
    if (!trimmed) return Promise.reject(new Error('ENOSCHEME'));
    const idx = trimmed.indexOf(':');
    if (idx < 0) return Promise.reject(new Error('ENOSCHEME'));
    const scheme = trimmed.slice(0, idx);
    const body = trimmed.slice(idx + 1);
    const loader = loaders.get(scheme);
    if (!loader) return Promise.reject(new Error('EUNKNOWN'));
    const ctx = {
      origin: baseOrigin,
      options: baseOptions,
      signal: undefined,
      ...ctxOverride,
      resolve: (p, o) => resolve(p, o || ctxOverride),
    };
    // Loaders MUST surface operational failures as rejected promises (§8.2);
    // wrap so a synchronous throw still becomes a rejection.
    try { return Promise.resolve(loader(body, ctx)); }
    catch (e) { return Promise.reject(e); }
  }

  const dispatcher = {
    register(scheme, loader) { loaders.set(scheme, loader); },
    unregister(scheme) { loaders.delete(scheme); },
    has(scheme) { return loaders.has(scheme); },
    resolve,
  };

  // Default registrations (§3.1). A shell may unregister any of these to
  // shrink its attack surface (§11).
  dispatcher.register('inline', inlineLoader);
  dispatcher.register('i', iLoader);
  dispatcher.register('q', qLoader);
  dispatcher.register('url', urlLoader);
  dispatcher.register('gh', ghLoader);
  dispatcher.register('gist', gistLoader);
  dispatcher.register('zenodo', zenodoLoader);
  dispatcher.register('doi', doiLoader);
  dispatcher.register('rentry', rentryLoader);

  return dispatcher;
}

// ===== src/share.js ====================================================
// @gcu/capsule — share helpers (SPEC-capsule §14, §6.2).
//
// Size *literacy*, not size *limiting*. These helpers measure a capsule and
// report which channels its share URL fits in — they NEVER refuse to produce
// a capsule. The caller decides what to do with an over-budget result.
//
// CHANNELS is the single source of truth for the per-channel limits; the
// table in CAPSULES.md §6 mirrors these numbers (keep them in sync). Limits
// are practical "scans/pastes reliably" figures, not hard protocol maxima —
// verify against your real target if a few hundred bytes matter.

/**
 * Safe share-URL lengths per channel, in bytes (≈ characters for ASCII URLs).
 * `urlBytes` is the whole URL — origin + path + '#' + escaped capsule.
 */
const CHANNELS = [
  { id: 'sms',       label: 'SMS',                urlBytes: 160,   note: 'single GSM segment' },
  { id: 'qr-v10',    label: 'QR v10 (M ECC)',     urlBytes: 270,   note: 'gacha-sticker scale, ~1 inch' },
  { id: 'qr-v15',    label: 'QR v15 (M ECC)',     urlBytes: 500,   note: 'scans casually from a phone' },
  { id: 'qr-v20',    label: 'QR v20 (M ECC)',     urlBytes: 800,   note: 'larger but still reliable' },
  { id: 'email-safe',label: 'Email (safe)',       urlBytes: 2000,  note: 'some gateways reject longer' },
  { id: 'twitter',   label: 'Twitter/X, Slack',   urlBytes: 4000,  note: 'char limits; URL counts in full' },
  { id: 'telegram',  label: 'Telegram',           urlBytes: 4096,  note: 'per-message character cap' },
  { id: 'email',     label: 'Email (typical)',    urlBytes: 8000,  note: 'common practical ceiling' },
  { id: 'whatsapp',  label: 'WhatsApp/Signal',    urlBytes: 8000,  note: 'long links stay clickable, ~practical' },
  { id: 'addressbar',label: 'Address bar (Chrome/FF)', urlBytes: 32000, note: 'some servers truncate lower' },
];

/**
 * Report which channels a URL of `urlByteLength` bytes fits in.
 * @returns {Array<{id,label,urlBytes,note,ok:boolean}>}
 */
function channelFit(urlByteLength) {
  return CHANNELS.map(c => ({ ...c, ok: urlByteLength <= c.urlBytes }));
}

const byteLen = s => (typeof TextEncoder !== 'undefined'
  ? new TextEncoder().encode(s).length
  : Buffer.byteLength(s, 'utf8'));

/**
 * Measure an already-built capsule string.
 * @param {string} capsule
 * @param {object} [opts] baseUrl — origin+path the capsule rides on (e.g.
 *   'https://gentropic.org/cradle'); when given, urlBytes includes it + '#'
 *   and the §6.4.1 fragment escaping (which can lengthen q: payloads).
 * @returns {{capsule,capsuleBytes,fragment,urlBytes,fits,largestFit}}
 */
function measureCapsule(capsule, opts = {}) {
  const fragment = fragmentEncode(capsule);
  const base = opts.baseUrl ? byteLen(opts.baseUrl) + 1 : 0; // +1 for '#'
  const urlBytes = base + byteLen(fragment);
  const fits = channelFit(urlBytes);
  // CHANNELS is ascending by size, so the FIRST passing channel is the
  // tightest one it fits — and fitting the tightest means it fits everything
  // looser too. null when it fits nothing listed.
  const tightestFit = (fits.find(f => f.ok) || {}).id || null;
  return {
    capsule,
    capsuleBytes: byteLen(capsule),
    fragment,
    urlBytes,
    fits,
    tightestFit,
  };
}

/**
 * Encode content AND measure it in one call. Always returns the capsule —
 * `fits`/`suggestion` are advisory only (§14, revised: no gating).
 *
 * @param {Uint8Array|string} content
 * @param {object} [opts] form/codec/dictId/dictionary/backend (see encodeInline)
 *   + baseUrl (see measureCapsule). Defaults to form 'q' (QR-oriented) since
 *   the tightest channels are the ones that need measuring.
 * @returns {Promise<{capsule,capsuleBytes,fragment,urlBytes,fits,tightestFit,suggestion}>}
 */
async function makeShare(content, opts = {}) {
  const capsule = await encodeInline(content, { form: 'q', ...opts });
  const m = measureCapsule(capsule, opts);
  let suggestion = null;
  if (!m.tightestFit) {
    suggestion = 'Capsule exceeds every listed channel; consider a reference '
      + 'scheme (gh:/gist:/rentry:) so the URL carries a pointer, not the bytes.';
  } else if (m.tightestFit === 'addressbar') {
    suggestion = 'Fits only the address bar — too large for QR or messaging. '
      + 'Trim the payload or publish to a host and share a reference capsule.';
  }
  return { ...m, suggestion };
}

        // ecl argument if it can be done without increasing the version.

                const usedBits = QrSegment.getTotalBits(segs, version);

            this.setFunctionModule(7, 8, getBit(bits, 8));
            for (let i = 9; i < 15; i++)

// The Hopper surface contract — `mount(ctx) → dispose` (DECISIONS §14).
//
// Every Hopper surface (Collect / Build / Analyze) is a pure function of an
// injected context that returns a teardown:
//
//   mount(ctx) → disposeFn | Promise<disposeFn>

// stateless jig); the rest are surface-specific. `dispose()` MUST release live
// OS/network resources — camera/MediaStreams, WebRTC/Trystero connections, loom
// grids, timers, and any document-level listeners — so a host can unmount a
// surface without leaking into its realm.
//
// This deliberately mirrors the Works inline-mount contract (auditable
// SURFACES.md §12.5, ctx = { root, bus, tab, vfs, home }): `store` stands in for
// `vfs`, and bus/tab/home are absent standalone. Keeping this shape now makes
// Works-citizenship a later thin A-Bus adapter rather than a rewrite — see
// ../auditable/INTEROP.md and the §5.2 Surface ABI (@gcu/surface).

// bootSurface — the standalone host adapter. Waits for the DOM, finds the mount
// root (#app by default), calls mount({ root }), and holds the returned dispose
// for teardown on page hide (so a reload never leaks a live camera). The `mount`
// callback builds the rest of `ctx` (creating the store, decoding a hash, …) and
// returns the surface's dispose. Mirrors @gcu/surface's `bootSurface` role for
// the sandboxed path. Init errors render into the root rather than blanking it.

// Returns a `teardown()` the caller can invoke directly (HMR, tests).
function bootSurface(mount, opts = {}) {

    if (disposed) return;
    disposed = true;
    if (typeof dispose === 'function') { try { dispose(); } catch {} }
    dispose = null;
  };

  const start = async () => {
    const root = document.getElementById(rootId);
    if (!root) return;
    try { dispose = await mount({ root }); }
    catch (e) { root.textContent = `${label} init error: ${(e && e.message) || e}`; }

      if (!query.sort || !query.sort.by) return;
      query.sort.dir = query.sort.dir === 'desc' ? 'asc' : 'desc';
      sdir.textContent = dirText(); run();
    });
    srow.append(ssel, sdir);
    builder.append(srow);
  }

  // The result columns for the current query — mirrors runQuery's column logic so
  // the Sort dropdown only offers columns that exist in the output.
  function outputColumns() {
    if (!current) return [];
    const baseCols = current.table.columns;
    const computedCols = (query.computed || []).map((c) => ({ name: c.name, label: c.label || c.name }));
    if (query.groupBy) {
      const aggs = (query.aggregates && query.aggregates.length) ? query.aggregates : [{ op: 'count', as: 'count' }];
      const g = baseCols.concat(computedCols).find((x) => x.name === query.groupBy);
      return [{ name: query.groupBy, label: (g && g.label) || query.groupBy }]
        .concat(aggs.map((a) => ({ name: aggKey(a), label: a.label || aggKey(a) })));
    }
    if (query.aggregates && query.aggregates.length) return query.aggregates.map((a) => ({ name: aggKey(a), label: a.label || aggKey(a) }));
    return baseCols.concat(computedCols);
  }

  // A computed-column editor row: name + total-calculus expression + delete.
  function computedRow(c, i, baseCols) {
    const row = mel('div', 'mill-row mill-comprow');
    const nameIn = mel('input', 'mill-compname'); nameIn.placeholder = 'name'; nameIn.value = c.name || '';
    const exprIn = mel('input', 'mill-compexpr'); exprIn.placeholder = 'expression  ·  e.g. fe_pct * 2'; exprIn.value = c.expr || '';
    nameIn.addEventListener('change', () => {
      c.name = slugName(nameIn.value) || `calc_${i + 1}`;
      if (nameIn.value !== c.name) nameIn.value = c.name;
      c.label = c.name;
      renderBuilder(); run();                                      // name change shifts downstream column lists
    });
    exprIn.addEventListener('change', () => {
      const resolved = resolveBacktickRefs(exprIn.value, baseCols);
      if (resolved !== exprIn.value) exprIn.value = resolved;
      c.expr = exprIn.value.trim();
      run();
    });
    const del = mel('button', 'co-btn co-ghost mill-mini', '✕');
    del.addEventListener('click', () => { query.computed.splice(i, 1); renderBuilder(); run(); });
    row.append(nameIn, exprIn, del);
    return row;
  }

  function aggRow(a, i, cols) {
    const row = mel('div', 'mill-row mill-aggrow');
    const opSel = mel('select', 'mill-aggop');
    for (const op of AGG_OPS) opSel.append(new Option(op, op));
    opSel.value = a.op;
    const fldSel = mel('select', 'mill-aggfield');
    fldSel.append(new Option('(rows)', ''));
    for (const c of cols) fldSel.append(new Option(c.label || c.name, c.name));
    fldSel.value = a.field || '';
    const sync = () => { a.op = opSel.value; a.field = fldSel.value || undefined; a.as = `${a.op}_${a.field || 'rows'}`; run(); };
    opSel.addEventListener('change', sync);
    fldSel.addEventListener('change', sync);
    const del = mel('button', 'co-btn co-ghost mill-mini', '✕');
    del.addEventListener('click', () => { query.aggregates.splice(i, 1); renderBuilder(); run(); });
    row.append(opSel, fldSel, del);
    return row;
  }

  function run() {
    if (!current) { gridHost.replaceChildren(); chartHost.replaceChildren(); return; }
    let res;
    try { res = runQuery(query, current.table); if (filterErr) filterErr.textContent = ''; }
    catch (e) { if (filterErr) filterErr.textContent = e.message; return; }
    resultsH.textContent = `Results · ${res.rows.length} row${res.rows.length === 1 ? '' : 's'}`;
    renderGrid(res);
    renderChart(res);
  }

  function renderGrid(res) {
    if (grid && grid.destroy) { try { grid.destroy(); } catch {} }
    gridHost.replaceChildren();
    const provider = loom.createMemoryProvider({
      columns: res.columns.map((c) => ({ name: c.label || c.name })),
      rows: res.rows.map((r) => res.columns.map((c) => r[c.name])),
    });
    grid = loom.createGrid(gridHost, provider, { theme: 'dark' });
  }

  function renderChart(res) {
    chartHost.replaceChildren();
    if (!query.groupBy) return;                                // chart = aggregate-by-group bar
    const numCol = res.columns.find((c) => c.fieldType === 'number');
    if (!numCol) return;
    try {
      const { fig, ax } = plot.subplots(1, 1);
      ax.bar(res.rows.map((r) => String(r[query.groupBy])), res.rows.map((r) => Number(r[numCol.name]) || 0));
      chartHost.append(fig.show());                            // show() renders + returns the canvas
    } catch { /* charting is best-effort */ }
  }

  // ---- save / share an analysis (the query is plain, total data → travels like a form) ----
  // match by form hash (exact), else by form id (same form, possibly re-versioned).
  function applyAnalysis(a) {
    const match = withRecs.find((x) => x.hash === a.form)
      || withRecs.find((x) => x.tree && x.tree.meta && x.tree.meta.id === a.formId);
    if (!match) throw new Error(`this analysis targets a form not in the open archive (${a.formTitle || a.formId || a.form})`);
    formSel.value = match.hash;
    selectForm(match.hash, a.query);
  }

  async function doShare() {
    const a = { kind: 'hopper-analysis', v: 1, form: current.form.hash, formId: current.form.tree.meta && current.form.tree.meta.id, formTitle: current.form.title, query };
    const base = location.origin + location.pathname;
    let url, fit;
    try { const s = await capsule.makeShare(JSON.stringify(a), { form: 'q', baseUrl: base }); url = base + '#' + s.fragment; fit = `${s.urlBytes} B · ${s.tightestFit ? 'fits ' + s.tightestFit : 'link only'}`; }
    catch (e) { millToast('Could not build share: ' + e.message); return; }
    const scrim = mel('div', 'co-scrim'); const panel = mel('div', 'co-confirm co-share');
    panel.append(mel('h3', 'co-confirm-h', 'Share this analysis'));
    panel.append(mel('div', 'co-confirm-title', `${current.form.title} — ${query.groupBy ? 'by ' + query.groupBy : 'records'}`));
    try { const w = mel('div', 'co-qr-wrap'); w.append(millQrSvg(url)); panel.append(w); }
    catch { panel.append(mel('div', 'co-share-toobig', '⚠ Too large for a QR — use the link.')); }
    const linkRow = mel('div', 'co-share-link');
    const input = mel('input', 'co-share-url'); input.readOnly = true; input.value = url;
    const copy = mel('button', 'co-btn', 'Copy link');
    copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(url); copy.textContent = 'Copied ✓'; } catch { input.select(); } });
    linkRow.append(input, copy); panel.append(linkRow, mel('div', 'co-confirm-meta', fit));
    const close = mel('button', 'co-btn co-ghost', 'Close'); close.addEventListener('click', () => scrim.remove());
    panel.append(close); scrim.append(panel);
    scrim.addEventListener('click', (e) => { if (e.target === scrim) scrim.remove(); });
    document.body.append(scrim); millOverlays.add(scrim);
  }

  function doOpen() {
    const scrim = mel('div', 'co-scrim'); const panel = mel('div', 'co-confirm');
    panel.append(mel('h3', 'co-confirm-h', 'Open an analysis'));
    const ta = mel('textarea', 'co-paste-input'); ta.rows = 3; ta.placeholder = 'paste an analysis capsule (q:…) or a share link';
    const err = mel('div', 'mill-err');
    const actions = mel('div', 'co-confirm-actions');
    const cancel = mel('button', 'co-btn co-ghost', 'Cancel'); cancel.addEventListener('click', () => scrim.remove());
    const apply = mel('button', 'co-btn', 'Apply');
    apply.addEventListener('click', async () => {
      err.textContent = ''; apply.disabled = true;
      try { applyAnalysis(await resolveAnalysis(ta.value)); scrim.remove(); }
      catch (e) { err.textContent = e.message; apply.disabled = false; }
    });
    actions.append(cancel, apply);
    panel.append(ta, err, actions); scrim.append(panel);
    scrim.addEventListener('click', (e) => { if (e.target === scrim) scrim.remove(); });
    document.body.append(scrim); millOverlays.add(scrim);
  }

  function millToast(msg) { const t = mel('div', 'co-toast', msg); document.body.append(t); setTimeout(() => t.remove(), 3500); }

  if (ctx.analysis) {
    try { applyAnalysis(ctx.analysis); }
    catch (e) { millToast(e.message); if (withRecs.length) { formSel.value = withRecs[0].hash; selectForm(withRecs[0].hash); } }
  } else if (withRecs.length) { formSel.value = withRecs[0].hash; selectForm(withRecs[0].hash); }

  // dispose() — destroy the loom grid (canvas + observers) and remove any
  // body-attached share/open overlays. Idempotent.
  return () => {
    if (grid && grid.destroy) { try { grid.destroy(); } catch {} grid = null; }
    for (const s of millOverlays) { try { s.remove(); } catch {} }
    millOverlays.clear();
  };
}

// ── src/js/mill/boot.js ──
// mill entry — open a repo archive (the collector's "Export archive" bundle) into
// an in-memory store, then mount the analysis console over its resolved union via
// the surface contract (mount(ctx) → dispose). If the page is opened at a shared-
// analysis link (mill.html#<capsule>), the analysis is decoded and applied once
// you open the archive it targets — analyses travel like forms. Standalone
// surface: no IDB, no SW (ephemeral session).







const ce = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// A shared-analysis capsule in the URL #fragment → the analysis object (or null).
async function decodeHashAnalysis() {
  const h = (location.hash || '').slice(1);
  if (!h) return null;
  try {
    const bytes = await capsule.resolve(capsule.fragmentDecode(h));
    const obj = JSON.parse(new TextDecoder().decode(bytes));
    return (obj && obj.kind === 'hopper-analysis') ? obj : null;
  } catch { return null; }
}

// Render the open-archive landing. On a chosen file, mount the mill and report its
// dispose back via onMount so the surface teardown can reach the live grid.
function landing(app, pending, onMount) {
  app.replaceChildren();
  const wrap = ce('div', 'mill-landing');
  wrap.append(ce('h1', 'mill-brand', 'Hopper · mill'));
  wrap.append(ce('p', 'mill-sub', 'Open a Hopper archive (.json) to analyze its records.'));
  if (pending) wrap.append(ce('p', 'mill-pending', `An analysis is ready${pending.formTitle ? ` — "${pending.formTitle}"` : ''}. Open the archive it applies to and it will run automatically.`));
  const label = ce('label', 'co-btn mill-open', 'Open archive…');
  const input = ce('input'); input.type = 'file'; input.accept = '.json,application/json'; input.style.display = 'none';
  const err = ce('div', 'mill-err');
  label.append(input);
  input.addEventListener('change', async () => {
    const f = input.files && input.files[0]; if (!f) return;
    err.textContent = '';
    try {
      const bundle = JSON.parse(await f.text());
      const store = createStore(new vfs.MemoryBackend());
      await store.init({ name: 'mill' });
      await store.importBundle(bundle);                 // unions + verifies signatures
      const dispose = await mountMill({ root: app, store, analysis: pending });
      if (onMount) onMount(dispose);
    } catch (e) { err.textContent = 'Could not open: ' + e.message; }
  });
  wrap.append(label, err);
  app.append(wrap);
}

bootSurface(async ({ root }) => {
  let millDispose = null;
  let pending = null;
  try { pending = await decodeHashAnalysis(); } catch {}
  if (pending) { try { history.replaceState(null, '', location.pathname + location.search); } catch {} }   // one-shot: clear the hash
  landing(root, pending, (d) => { millDispose = d; });
  return () => { if (millDispose) { try { millDispose(); } catch {} millDispose = null; } };
}, { label: 'mill' });
</script>
